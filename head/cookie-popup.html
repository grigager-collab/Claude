<!-- ════ 2Y4U: ОКНО ПРО COOKIE ════
     Показывается один раз. Выбор хранится в cookie t2y_cc на год:
     «all» — принял все, «nec» — только необходимые.
     На будущее (Метрика): ставить её, только если window.t2yCookieOK() === true. -->
<style>
.t2y-cc {
  position: fixed; inset: 0; z-index: 2147483000;
  display: flex; align-items: center; justify-content: center;
  padding: 16px; box-sizing: border-box;
  background: rgba(0, 0, 0, .45);
}
.t2y-cc__box {
  width: 100%; max-width: 420px; box-sizing: border-box;
  padding: 28px 24px 24px; background: #ffffff; color: #000000;
}
.t2y-cc__title {
  font-family: 'Tenor Sans', 'Tenor', Arial, sans-serif;
  font-size: 20px; font-weight: 400; line-height: 1.3;
  margin: 0 0 12px;
}
.t2y-cc__text {
  font-family: 'Raleway', Arial, sans-serif;
  font-size: 14px; font-weight: 300; line-height: 1.6; color: #333333;
  margin: 0 0 22px;
}
.t2y-cc__text a {
  color: #000000 !important; text-decoration: none !important;
  border-bottom: 1px solid #bbbbbb;
}
.t2y-cc__btn {
  display: block; width: 100%; box-sizing: border-box;
  padding: 15px 20px; margin: 0 0 10px;
  font-family: 'Raleway', Arial, sans-serif; font-size: 15px; font-weight: 600;
  border: 1px solid #000000; border-radius: 0; cursor: pointer;
  background: #000000; color: #ffffff;
  -webkit-appearance: none; appearance: none;
}
.t2y-cc__btn_ghost { background: #ffffff; color: #000000; margin-bottom: 0; }
.t2y-cc__btn:hover { opacity: .85; }
</style>

<script>
(function () {
  var POLICY_URL = '/politika-obrabotki-persdannyh';

  function read() {
    var m = document.cookie.match(/(?:^|;\s*)t2y_cc=(all|nec)/);
    return m ? m[1] : null;
  }
  window.t2yCookieOK = function () { return read() === 'all'; };

  function save(v) {
    document.cookie = 't2y_cc=' + v + '; max-age=31536000; path=/; SameSite=Lax';
    try { document.dispatchEvent(new CustomEvent('t2y:cookie', { detail: v })); } catch (e) {}
  }

  function show() {
    if (read() || document.querySelector('.t2y-cc')) return;
    var wrap = document.createElement('div');
    wrap.className = 't2y-cc';
    wrap.setAttribute('role', 'dialog');
    wrap.setAttribute('aria-modal', 'true');
    wrap.setAttribute('aria-labelledby', 't2y-cc-title');
    wrap.innerHTML =
      '<div class="t2y-cc__box">' +
        '<p class="t2y-cc__title" id="t2y-cc-title">Файлы cookie</p>' +
        '<p class="t2y-cc__text">Мы используем cookie, чтобы сайт работал, ' +
          'и для анализа посещаемости. Подробнее — в <a href="' + POLICY_URL + '">' +
          'политике обработки персональных данных</a>.</p>' +
        '<button type="button" class="t2y-cc__btn" data-v="all">Принять</button>' +
        '<button type="button" class="t2y-cc__btn t2y-cc__btn_ghost" data-v="nec">Только необходимые</button>' +
      '</div>';
    wrap.addEventListener('click', function (e) {
      var b = e.target.closest('[data-v]');
      if (!b) return;
      save(b.getAttribute('data-v'));
      wrap.remove();
    });
    document.body.appendChild(wrap);
  }

  /* небольшая пауза, чтобы окно не мешало первой отрисовке страницы */
  function start() { setTimeout(show, 700); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
<!-- ════ конец: окно про cookie ════ -->
