<!-- ═══ 2young4u.ru — КОД HEAD, 06.11.2026 ═══
     Здесь только пометка страниц карточек: она должна сработать до отрисовки.
     Весь остальной общий код — в блоке «HTML-код», первом в «Шапке 1.1»
     (в репозитории head/HEAD-v-shapke-T123.html).
     HEAD не раздувать: на страницах /tproduct/ Tilda обрезает его после ~46 тыс. знаков,
     и страница товара открывается пустой.
     id="t2y-head-anchor" не убирать: к этому месту блок из «Шапки» возвращает свои стили. -->
<script id="t2y-head-anchor">
/* Помечаем страницы карточек товара. Скрипт лежит в HEAD и отрабатывает
   до отрисовки, так что подложка не успевает мигнуть на чужих страницах.

   Два шаблона адреса:
     /p/…        — наши собственные страницы карточек
     /tproduct/… — стандартная страница Tilda (если у товара не прописан
                   URL, витрина ведёт туда; на всякий случай ловим и её) */
(function () {
  var p = location.pathname;
  if (p.indexOf('/p/') === 0 || p.indexOf('/tproduct/') !== -1) {
    document.documentElement.className += ' t2y-card-page';
  }
})();
</script>
