<!-- ════ 2Y4U: ШАПКА — «Мужское» / «Женское»: наведение раскрывает меню,
     клик ведёт в каталог /men и /women.  Версия 3, 25.10.2026 ════
     У кнопки Zero Block одна ссылка — #formanpopup / #forwomenpopup
     (всплывающее меню). Скрипт перехватывает КЛИК и ведёт в каталог,
     наведение не трогает — меню раскрывается как раньше.

     ВЕРСИЯ 3: вторая смотрела только координаты клика и уводила в каталог,
     даже когда поверх шапки открыта корзина (поиск, избранное) — клик
     проходил «сквозь» окно. Теперь сначала проверяем, что под курсором
     видна сама шапка. Если сверху другое окно — клик достаётся ему:
     корзина просто закрывается, как при любом клике мимо неё.

     Только для мыши. На телефонах и планшетах тап раскрывает меню, как было,
     поэтому «Всё мужское» / «Всё женское» в бургер-меню удалять НЕЛЬЗЯ.
     Ctrl/Cmd + клик — каталог в новой вкладке.

     Версия 2 стояла в HEAD — тот блок из HEAD УДАЛИТЬ: он срабатывает
     раньше этого и уводит сквозь корзину по-прежнему. -->
<script>
(function () {
  // хук всплывающего меню → куда вести по клику
  var MAP = {
    '#formanpopup':   '/men',
    '#forwomenpopup': '/women'
  };
  var HEADER = '#rec2498768581';   // Zero Block шапки
  // Что может лежать поверх слова, и клик всё равно наш: сама шапка и
  // выпадающие списки «Мужское» / «Женское» — их край заходит на слово.
  var OWN = HEADER + ', #rec2501314481, #rec2501320251';

  if (!window.matchMedia ||
      !window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;

  // Какой пункт шапки под точкой (x, y) — по прямоугольнику ссылки:
  // край выпадающего списка может лежать поверх самого слова.
  function hit(x, y) {
    for (var hook in MAP) {
      var links = document.querySelectorAll(HEADER + ' a[href="' + hook + '"]');
      for (var i = 0; i < links.length; i++) {
        var r = links[i].getBoundingClientRect();
        if (r.width > 0 && r.height > 0 &&
            x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {
          return MAP[hook];
        }
      }
    }
    return null;
  }

  // window + фаза перехвата — самая ранняя точка, куда приходит клик.
  window.addEventListener('click', function (e) {
    if (e.button !== 0) return;
    var url = hit(e.clientX, e.clientY);
    if (!url) return;

    // Сверху открыто другое окно (корзина, поиск, избранное) — клик его.
    var top = document.elementFromPoint(e.clientX, e.clientY);
    if (!top || !top.closest(OWN)) return;
    // Сверху другая ссылка (пункт выпадающего списка) — пусть работает она.
    var a = top.closest('a');
    if (a && !MAP[a.getAttribute('href')]) return;

    e.preventDefault();
    e.stopImmediatePropagation();

    if (e.ctrlKey || e.metaKey || e.shiftKey) {
      window.open(url, '_blank');
    } else {
      window.location.href = url;
    }
  }, true);
})();
</script>
<!-- ════ конец: клик по «Мужское» / «Женское» ════ -->
