<!-- ════════════════════════════════════════════════════════════════
     ШАПКА: «Мужское» / «Женское» — НАВЕДЕНИЕ раскрывает меню,
     КЛИК ведёт в каталог.  Создано 19.10.2026.

     ЗАЧЕМ: у элемента Zero Block одна ссылка. Сейчас у «Мужского» это
     #formanpopup (всплывающее меню), и по клику в каталог не попасть —
     поэтому пришлось добавлять пункты «Всё мужское» / «Всё женское».
     Скрипт перехватывает именно КЛИК и отправляет на /men и /women,
     а наведение не трогает — меню раскрывается как раньше.

     ТОЛЬКО ДЛЯ МЫШИ. На телефонах и планшетах наведения нет, поэтому там
     всё остаётся как было: тап раскрывает меню. Поэтому пункты
     «Всё мужское» / «Всё женское» на сенсорных экранах нужны по-прежнему —
     а в мобильном меню-бургере (T450) их удалять НЕЛЬЗЯ: там это
     единственный путь в общий каталог.

     Ctrl/Cmd + клик — открывает каталог в новой вкладке, как обычная ссылка.

     КУДА: Настройки сайта → HTML-код внутрь HEAD, в самый конец.
     ════════════════════════════════════════════════════════════════ -->

<script>
(function () {
  // хук всплывающего меню → куда вести по клику
  var MAP = {
    '#formanpopup':   '/men',
    '#forwomenpopup': '/women'
  };
  var HEADER = '#rec2498768581';   // Zero Block шапки («Шапка 1.1»)

  // Только устройства с настоящей мышью. На сенсорных экранах
  // наведения нет — там тап должен по-прежнему раскрывать меню.
  if (!window.matchMedia ||
      !window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;

  // Слушаем в фазе ПЕРЕХВАТА (true), чтобы сработать раньше обработчика
  // Tilda, который по клику открывает меню.
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if (!a) return;
    var url = MAP[a.getAttribute('href')];
    if (!url || !a.closest(HEADER)) return;

    e.preventDefault();
    e.stopImmediatePropagation();

    if (e.ctrlKey || e.metaKey || e.shiftKey) {
      window.open(url, '_blank');
    } else {
      window.location.href = url;
    }
  }, true);
})();
</script>
