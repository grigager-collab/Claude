<!-- ════════════════════════════════════════════════════════════════
     ШАПКА: «Мужское» / «Женское» — НАВЕДЕНИЕ раскрывает меню,
     КЛИК ведёт в каталог.  Создано 19.10.2026, версия 2.

     ЗАЧЕМ: у элемента Zero Block одна ссылка. Сейчас у «Мужского» это
     #formanpopup (всплывающее меню), и по клику в каталог не попасть.
     Скрипт перехватывает КЛИК и отправляет на /men и /women,
     наведение не трогает — меню раскрывается как раньше.

     ВЕРСИЯ 2 — ПОЧЕМУ ПЕРВАЯ НЕ СРАБОТАЛА: меню открывается по наведению
     (data-popup-hover-trigger="y") вместе с подложкой t-popup__bg, и подложка
     ложится поверх слова «Мужское». Клик попадал в неё, а первая версия
     искала под курсором саму ссылку — и не находила. Теперь проверяются
     КООРДИНАТЫ клика: попал в прямоугольник слова в шапке — переход,
     что бы сверху ни лежало.

     ТОЛЬКО ДЛЯ МЫШИ. На телефонах и планшетах наведения нет — там всё
     как было: тап раскрывает меню. Поэтому «Всё мужское» / «Всё женское»
     в мобильном меню-бургере (T450) удалять НЕЛЬЗЯ.

     Ctrl/Cmd + клик — каталог в новой вкладке.

     КУДА: Настройки сайта → HTML-код внутрь HEAD, в самый конец.
     ПЕРВУЮ ВЕРСИЮ ЭТОГО БЛОКА — УДАЛИТЬ ЦЕЛИКОМ.
     ════════════════════════════════════════════════════════════════ -->

<script>
(function () {
  // хук всплывающего меню → куда вести по клику
  var MAP = {
    '#formanpopup':   '/men',
    '#forwomenpopup': '/women'
  };
  var HEADER = '#rec2498768581';   // Zero Block шапки («Шапка 1.1»)

  if (!window.matchMedia ||
      !window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;

  // Какой пункт шапки лежит под точкой (x, y) — по прямоугольнику ссылки,
  // а не по элементу под курсором: сверху может лежать подложка меню.
  function hit(x, y) {
    for (var hook in MAP) {
      var links = document.querySelectorAll(HEADER + ' a[href="' + hook + '"]');
      for (var i = 0; i < links.length; i++) {
        var r = links[i].getBoundingClientRect();
        if (r.width > 0 && r.height > 0 &&
            x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {
          return MAP[hook];
        }
      }
    }
    return null;
  }

  // window + фаза перехвата — самая ранняя точка, куда приходит клик.
  window.addEventListener('click', function (e) {
    if (e.button !== 0) return;
    var url = hit(e.clientX, e.clientY);
    if (!url) return;

    e.preventDefault();
    e.stopImmediatePropagation();

    if (e.ctrlKey || e.metaKey || e.shiftKey) {
      window.open(url, '_blank');
    } else {
      window.location.href = url;
    }
  }, true);
})();
</script>
