/* 6. Телефоны и планшеты (до 1199 px): шапка всегда белая (просьба
      заказчицы 25.10: «то белая, то окрашивается от модулей»).

      прокрутки на 100–600 px, а матовый (белый 15 % + размытие) стоит
      всегда — сквозь него просвечивали фото и тёмные блоки. Даём шапке
      плотный белый фон, матовый слой убираем. ПК (от 1200 px) — тоже белая

      цвет остальной страницы» — при прокрутке белый слой Tilda проявлялся
      постепенно, и сквозь шапку просвечивал каталог). Исключение — страница
      начинается с крупного фото во всю ширину (обложка «О бренде»): там
      шапка прозрачная поверх фото, как задумано. Класс ставит скрипт п. 7. */
@media screen and (max-width: 1199px) {
  #rec2498768581 .t396__artboard { background-color: #ffffff !important; }
  #rec2498768581 .tn-elem[data-elem-id="1778446246187000001"] { display: none !important; }
  /* к п. 7: слайдер на весь экран (главная на телефоне) встал под шапку —
     он короче на её высоту, подпись и «Больше» остаются на первом экране */
  .t2y-fs .t994__width-wrapper, .t2y-fs .t994__slidecontainer,
  .t2y-fs .t994__item, .t2y-fs .t994__item-wrapper { height: var(--t2y-fs-h) !important; }
}
@media screen and (min-width: 1200px) {
  html.t2y-hdr-white #rec2498768581 .t396__artboard { background-color: #ffffff !important; }
  html.t2y-hdr-white #rec2498768581 .tn-elem[data-elem-id="1778446246187000001"] { display: none !important; }
}
</style>
<script>
(function () {
  // 7. К п. 6: шапка висит поверх страницы. Если страница начинается с фото
  //    (главная на телефоне), белая шапка закрыла бы его верх — сдвигаем
  //    первый блок вниз на высоту шапки (она разная: 50–78 px по ширине).
  //    Слайдер на весь экран при этом становится короче на ту же высоту.
  //    Короткую полоску-отступ сверху (белая полоса на «О бренде» на телефоне)
  //    не трогаем — она для того и стоит.
  //    ПК (от 1200 px) ничего не сдвигаем: там содержимое и так ниже шапки.
  //    Только решаем, какой быть шапке: белой (класс t2y-hdr-white) или
  //    прозрачной — если страница начинается с крупного фото во всю ширину.
  var MEDIA = 'img, video, iframe, .t-bgimg, .t-cover__carrier, [data-original], [data-content-cover-bg]';
  var moved = null, fsLock = null;

  // первый блок страницы, если у него фото под шапкой; иначе null.
  // shift — сколько добавить сверху, чтобы блок встал ровно под шапку
  function photoBlock(hh) {
    var recs = document.querySelectorAll('#allrecords .t-rec');
    for (var i = 0; i < recs.length; i++) {
      var r = recs[i];
      if (r.closest('header, footer') || r.offsetHeight < 5) continue;  // шапка, подвал, коды, скрытые
      var rt = r.getBoundingClientRect().top;
      // место блока без нашего сдвига (его не снимаем — страница не дёргается)
      var top = rt + window.pageYOffset - (r === moved ? parseFloat(r.style.marginTop) || 0 : 0);
      if (top >= hh || r.offsetHeight < 2 * hh) return null;   // уже ниже шапки / полоска-отступ
      var m = r.querySelectorAll(MEDIA);
      for (var j = 0; j < m.length; j++) {
        var b = m[j].getBoundingClientRect();
        if (b.width && b.height && top + (b.top - rt) < hh) return { rec: r, shift: Math.round(hh - top), media: b };
      }
      return null;
    }
    return null;
  }

  var watched = false;
  function fit() {
    var art = document.querySelector('#rec2498768581 .t396__artboard');
    // высоту шапки Tilda пересчитывает сама и позже нас — следим за ней
    if (art && !watched && window.ResizeObserver) { watched = true; new ResizeObserver(later).observe(art); }
    var desk = window.innerWidth >= 1200;
    var hh = art ? art.offsetHeight : 0;
    var p = hh ? photoBlock(hh) : null;
    if (desk) {
      // крупное фото — шире 60 % экрана прямо под шапкой
      var big = !!(p && p.media.width >= 0.6 * window.innerWidth);
      document.documentElement.classList.toggle('t2y-hdr-white', !big);
      p = null;
    } else {
      document.documentElement.classList.remove('t2y-hdr-white');
    }
    if (moved && (!p || p.rec !== moved)) {
      moved.style.marginTop = ''; moved.classList.remove('t2y-fs'); moved = null;
    }
    if (!p) return;
    var r = p.rec;
    if (r.style.marginTop !== p.shift + 'px') r.style.marginTop = p.shift + 'px';
    // слайдер Tilda на весь экран: высоту ему пишет сама Tilda (по высоте экрана) —
    // берём её и уменьшаем на сдвиг (CSS в п. 6)
    var w = r.querySelector('.t994__width-wrapper'), H = w ? parseFloat(w.style.height) || 0 : 0;
    if (H >= window.innerHeight - 2) r.classList.add('t2y-fs');
    if (H && r.classList.contains('t2y-fs')) {
      // в Safari при прокрутке сворачивается панель браузера и меняется высота
      // экрана — Tilda тут же меняет высоту слайдера, и всё под ним ездит
      // (заказчица 27.10: «стало всё двигаться»). Высоту берём при открытии
      // страницы и меняем только при смене ширины (поворот телефона)
      if (!fsLock || fsLock.w !== window.innerWidth) fsLock = { w: window.innerWidth, h: H };
      r.style.setProperty('--t2y-fs-h', (fsLock.h - p.shift) + 'px');
    }
    // блок может вырасти позже (слайдер Tilda запускается не сразу) — пересчитать
    if (window.ResizeObserver && !r.t2yWatch) { r.t2yWatch = true; new ResizeObserver(later).observe(r); }
    moved = r;
  }

  var t;
  function later() { clearTimeout(t); t = setTimeout(fit, 150); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fit);
  else fit();
  window.addEventListener('load', fit);
  [600, 2000].forEach(function (ms) { setTimeout(fit, ms); });
  window.addEventListener('resize', later);
  window.addEventListener('orientationchange', later);
})();

(function () {
  // 8. Список «Мужское» на ПК (Zero-блок) — в том же порядке, что раздел
  //    «Мужское» в мобильном меню (бургере). Порядок меняется в одном месте —
  //    в бургере (Контент меню), список на ПК подстраивается сам, двигать
  //    пункты в Zero-блоке не нужно. Пункт, которого нет в бургере, — в конце.
  //    Для «Женского» — добавить ['#rec2501320681', '/women/'] в LISTS.
  var LISTS = [['#rec2501315011', '/men/']];
  var TOP = 58, STEP = 27;   // место первого пункта и шаг, в единицах сетки Zero-блока

  function path(h) {
    try { return new URL(h, location.href).pathname.replace(/\/+$/, ''); } catch (e) { return ''; }
  }

  // Места пишем правилами CSS с !important: Tilda сама проставляет пунктам
  // top прямо в style (при запуске Zero-блока) и перетёрла бы значения в style.
  function sync() {
    var burger = [];
    document.querySelectorAll('#rec2501340841 a[href]').forEach(function (a) {
      var p = path(a.getAttribute('href'));
      if (burger.indexOf(p) < 0) burger.push(p);
    });
    var css = '';
    LISTS.forEach(function (L) {
      var rec = document.querySelector(L[0]);
      if (!rec) return;
      var items = [];
      rec.querySelectorAll('.tn-elem[data-elem-type="text"]').forEach(function (e) {
        var a = e.querySelector('a[href]');
        if (!a) return;
        var i = burger.indexOf(path(a.getAttribute('href')));
        var top = parseFloat(e.getAttribute('data-field-top-value')) || 0;
        items.push({ id: e.getAttribute('data-elem-id'), key: i < 0 ? 1000 + top : i });
      });
      if (!items.length) return;
      items.sort(function (a, b) { return a.key - b.key; });
      items.forEach(function (x, k) {
        // высота у всех одна: у копии пункта она бывает другой, и текст съезжает вниз
        css += L[0] + ' .tn-elem[data-elem-id="' + x.id + '"] { top: ' + (TOP + k * STEP) + 'px !important; height: 28px !important; }\n';
      });
      // белый фон списка — под число пунктов (последний пункт + 5 px снизу)
      var bg = rec.querySelector('.tn-elem[data-elem-type="shape"]');
      if (bg) css += L[0] + ' .tn-elem[data-elem-id="' + bg.getAttribute('data-elem-id') + '"] { height: ' +
                     ((items.length - 1) * STEP + 33) + 'px !important; }\n';
    });
    var st = document.getElementById('t2y-menu-order');
    if (!st) { st = document.createElement('style'); st.id = 't2y-menu-order'; document.head.appendChild(st); }
    st.textContent = '@media screen and (min-width: 641px) {\n' + css + '}';
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', sync);
  else sync();
})();
</script>
