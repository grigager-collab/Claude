<!-- ════ 2Y4U: ТАБЛИЦА РАЗМЕРОВ — текст под таблицей (25.10.2026) ════
     Окно «таблица размеров» строит скрипт в HEAD (.t2y-size-modal).
     Этот скрипт дописывает под таблицу текст заказчицы и убирает служебную
     строку «Значения примерные — заменить на реальные в коде», которую
     видели покупатели. Текст меняется прямо здесь, в INFO. -->
<style>
.t2y-size-note { display: none !important; }
.t2y-size-info {
  margin: 22px 0 0; text-align: left;
  font-family: 'Raleway', Arial, sans-serif; font-weight: 300;
  font-size: 14px; line-height: 1.55; color: #333333;
}
.t2y-size-info p { margin: 0 0 12px; }
.t2y-size-info b { font-weight: 600; color: #111111; }
.t2y-size-info h4 {
  font-family: 'Tenor Sans', Arial, sans-serif; font-weight: 400;
  font-size: 16px; color: #111111; margin: 20px 0 10px;
}
.t2y-size-info ol { margin: 0 0 14px; padding-left: 20px; }
.t2y-size-info ol > li { margin: 0 0 10px; }
.t2y-size-info ul { margin: 4px 0 0; padding-left: 18px; list-style: disc; }
.t2y-size-info ul li { margin: 0 0 4px; }
@media screen and (max-width: 640px) {
  .t2y-size-info { font-size: 13px; }
}
/* Текст длинный, окно прокручивается — крестик не должен уезжать вверх.
   top отрицательный: «липкий» отсчёт идёт от внутреннего отступа окна (40 px) */
.t2y-size-close {
  position: sticky !important; top: -30px; float: right; z-index: 2;
  margin: -30px -12px -32px 0; background: #ffffff !important; border-radius: 50%;
}
</style>
<script>
(function () {
  var INFO =
    '<p>Базовое исполнение наших костюмов рассчитано на рост 183 см и стандартное телосложение. Также предусмотрена стандартная посадка по фигуре. Размерный ряд от 46 до 54 (российский размер, размерная сетка по ГОСТу, где размер равен половине обхвата груди). Брюки прямые (не зауженные и не широкие). Мы делаем их чуть удлиненными, чтобы вы могли подогнуть исходя из длины ваших ног и обуви, с которой будете носить брюки.</p>' +
    '<p>В базовом исполнении на груди слева есть вышивка логотипа прописным шрифтом нитками в тон ткани.</p>' +
    '<p>Вы можете заказать пошив костюма с альтернативными опциями. Для этого, пожалуйста, укажите нужные изменения в разделе «Пожелания». Цена костюма для вас не изменится.</p>' +
    '<h4>Опции</h4>' +
    '<ol>' +
      '<li><b>Рост (см):</b> 165–170, 171–175, 176–179, 185–189, 190–194, 194–199</li>' +
      '<li><b>Размер:</b> 56–70</li>' +
      '<li><b>Вид телосложения:</b><ul>' +
        '<li>спортивный (широкий плечевой пояс, узкие бедра, увеличенный обхват ног);</li>' +
        '<li>плюс (увеличенный объем в области живота, бедер, бицепса, запястья).</li></ul></li>' +
      '<li><b>Посадка:</b><ul>' +
        '<li>свободная / удлиненная;</li>' +
        '<li>прилегающая (по фигуре, с маленькими прибавками).</li></ul></li>' +
      '<li><b>Персонализация:</b><ul>' +
        '<li>костюм без лого / другой вышивки;</li>' +
        '<li>вышивка логотипа / инициалов на груди или внутри на мешковине кармана, вместо стандартного лого или в дополнение.</li></ul></li>' +
    '</ol>' +
    '<p>Вы можете заказать определенное сочетание модели, цвета и вышивки костюма, если эта модель и этот цвет есть в базовой коллекции, но нет нужного вам сочетания.</p>' +
    '<p>Также мы можем учесть ваши пожелания по особой упаковке, доставке костюмов.</p>';

  function addInfo() {
    document.querySelectorAll('.t2y-size-modal').forEach(function (m) {
      if (m.querySelector('.t2y-size-info')) return;
      var box = document.createElement('div');
      box.className = 't2y-size-info';
      box.innerHTML = INFO;
      var table = m.querySelector('.t2y-size-table');
      if (table) table.parentNode.insertBefore(box, table.nextSibling);
      else m.appendChild(box);
    });
  }

  document.addEventListener('DOMContentLoaded', addInfo);
  window.addEventListener('load', addInfo);
  [500, 1500, 3000].forEach(function (t) { setTimeout(addInfo, t); });
  // окно могут построить и по первому нажатию на «таблица размеров»
  document.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('.t2y-size-link')) setTimeout(addInfo, 0);
  }, true);
})();
</script>
<!-- ════ конец: таблица размеров — текст ════ -->
