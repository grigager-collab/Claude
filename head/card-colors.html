<!-- ════ 2Y4U: КАРТОЧКА — другие цвета той же модели (26.10.2026) ════
     Каждый цвет — отдельный товар со своей страницей, поэтому в строке «Цвет»
     Tilda показывает один квадратик. Код рисует там квадратики всех цветов
     модели: текущий — в рамке, остальные ведут на свои страницы. Фото —
     первое фото каждого товара (каталог грузит часть 10). Вариант «Цвет»
     для корзины не трогаем — штатный квадратик только спрятан.

     MODELS — только ОДИНАКОВЫЕ вещи, разные цветом (сверено 26.10 по фото,
     описаниям и ценам). Порядок в списке = порядок квадратиков.
     Новый цвет — строка в свою модель: ['адрес-из-/p/', 'Название цвета'].
     НЕ одна модель, хоть и похожие названия:
       «Олимпийка хлопковая» синяя (/p/olimpiyka-hlopkovaya-siniy) — рукава-реглан;
       «Олимпийка с принтом Ватаным» синяя — отложной воротник, белые рукава. -->
<style>
/* штатный квадратик прячем (у HEAD своё правило display: flex !important — перебиваем точнее) */
.js-product-edition-option.t2y-colors-on .t-product__option-variants.t-product__option-variants_custom { display: none !important; }
/* квадратики — как штатные в HEAD: серая рамка, у текущего чёрная */
.t2y-colors { display: flex; flex-wrap: wrap; gap: 8px; }
.t2y-colors__item {
  display: block; width: 56px; height: 56px; box-sizing: border-box; overflow: hidden;
  border: 1px solid #e5e5e5; transition: border-color .2s ease;
}
a.t2y-colors__item:hover { border-color: #999999; }
.t2y-colors__item_active { border-color: #111111; }
.t2y-colors__img {
  display: block; width: 100%; height: 100%;
  background: #f2f2f2 center / cover no-repeat;
}
/* «Цвет: Volcano» — своя строка-заголовок; штатную прячем, но не трогаем:
   из её текста Tilda берёт название опции для корзины.
   Размер шрифта — как у заголовков опций в HEAD (16 px). */
.js-product-edition-option.t2y-colors-on .js-product-edition-option-name { display: none !important; }
.t2y-colors__title { font-size: 16px !important; line-height: 1.3 !important; }
.t2y-colors__name { color: #777777; }
</style>
<script>
(function () {
  if (!/^\/p\//.test(location.pathname)) return;

  var MODELS = [
    // Олимпийка хлопковая — воротник-стойка, карманы на молниях
    [['olimpiyka-hlopkovaya-chernyy', 'Чёрный'],
     ['olimpiyka-hlopkovaya-ocean-siniy', 'Ocean'],
     ['olimpiyka-hlopkovaya-volcano-korichnevyy', 'Volcano']],
    // Олимпийка классическая — отложной воротник («Дикаприо»)
    [['olimpiyka-klassicheskaya-ocean-siniy', 'Ocean'],
     ['olimpiyka-klassicheskaya-space-siniy', 'Space'],
     ['olimpiyka-klassicheskaya-volcano-korichnevyy', 'Volcano']],
    // Олимпийка с принтом Ватаным — стойка, герб на груди, символы на спине
    [['olimpiyka-vatanym', 'Молочный'],
     ['olimpiyka-s-printom-vatanym-chernyy', 'Чёрный']]
  ];

  function slug(u) { return String(u || '').split(/[?#]/)[0].replace(/\/+$/, '').split('/').pop().toLowerCase(); }
  var here = slug(location.pathname), model = null;
  MODELS.forEach(function (m) { m.forEach(function (c) { if (c[0] === here) model = m; }); });
  if (!model || !window.t2yCatalog) return;

  // квадратик 120×120 с CDN Tilda — как у штатного
  function thumb(u) {
    var m = /^https:\/\/static\.tildacdn\.com\/([^/]+)\/([^/?#]+)$/.exec(u || '');
    return m ? 'https://optim.tildacdn.com/' + m[1] + '/-/resize/120x120/-/format/webp/' + m[2] : u;
  }

  var colors = null;   // [адрес, название, фото] — те цвета, что есть в каталоге

  function draw() {
    if (!colors) return;
    document.querySelectorAll('.js-product-edition-option[data-edition-option-id="Цвет"]').forEach(function (opt) {
      if (opt.querySelector('.t2y-colors')) return;
      var html = '', name = '';
      colors.forEach(function (c) {
        var img = '<span class="t2y-colors__img" style="background-image:url(\'' + c[2] + '\')"></span>';
        if (c[0] === here) {
          name = c[1];
          html += '<span class="t2y-colors__item t2y-colors__item_active" title="' + c[1] + '" aria-current="true">' + img + '</span>';
        } else {
          html += '<a class="t2y-colors__item" href="/p/' + c[0] + '" title="' + c[1] + '" aria-label="Цвет ' + c[1] + '">' + img + '</a>';
        }
      });
      var box = document.createElement('div');
      box.className = 't2y-colors';
      box.innerHTML = html;
      opt.appendChild(box);
      opt.classList.add('t2y-colors-on');
      var title = opt.querySelector('.js-product-edition-option-name');
      if (title && name && !opt.querySelector('.t2y-colors__title')) {
        var t2 = title.cloneNode(false);   // те же классы оформления, но без js- класса Tilda
        t2.classList.remove('js-product-edition-option-name');
        t2.classList.add('t2y-colors__title');
        t2.textContent = title.textContent.trim();
        t2.insertAdjacentHTML('beforeend', '<span class="t2y-colors__name">: ' + name + '</span>');
        title.parentNode.insertBefore(t2, title);
      }
    });
  }

  window.t2yCatalog().then(function (list) {
    var photo = {};
    list.forEach(function (p) {
      var g = p.gallery;
      try { if (typeof g === 'string') g = JSON.parse(g); } catch (e) { g = null; }
      if (g && g[0] && g[0].img) photo[slug(p.url)] = g[0].img;
    });
    // у своего товара фото на месте всегда: если в каталоге его нет — штатный квадратик
    if (!photo[here]) {
      var own = document.querySelector('.js-product-edition-option[data-edition-option-id="Цвет"] .t-product__option-checkmark[data-original]');
      if (own) photo[here] = own.getAttribute('data-original');
    }
    var list2 = model.filter(function (c) { return photo[c[0]]; })
                     .map(function (c) { return [c[0], c[1], thumb(photo[c[0]])]; });
    if (list2.length < 2) return;   // других цветов в продаже нет — оставляем как есть
    colors = list2;
    draw();
    // строку «Цвет» Tilda строит сама и может перестроить — дорисовываем
    [600, 1500, 3000].forEach(function (ms) { setTimeout(draw, ms); });
    if (window.MutationObserver) {
      var t;
      new MutationObserver(function () { clearTimeout(t); t = setTimeout(draw, 100); })
        .observe(document.body, { childList: true, subtree: true });
    }
  }).catch(function () {});
})();
</script>
<!-- ════ конец: другие цвета ════ -->
