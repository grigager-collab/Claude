<script>
(function () {
  /* ── Параметры модели на фото ──
     На карточках в аккордеоне стоят прочерки («Рост модели: — см.»).
     Заказчица: у всех мужских — 188 см, размер XL/L. Меняем ТОЛЬКО прочерки:
     если на какой-то карточке вписать свои цифры, скрипт их не тронет. */
  var HEIGHT = '188';
  var SIZE = 'XL/L';

  function fillModel() {
    var src = document.querySelector('.t2y-acc-source');
    if (!src || src.getAttribute('data-crumb-parent') !== 'Мужское') return;
    document.querySelectorAll('.t2y-acc-source p, .product-popup-accordion p')
      .forEach(function (p) {
        var t = (p.textContent || '').replace(/\s+/g, ' ').trim();
        if (/^Рост модели: — см\.?$/.test(t)) p.textContent = 'Рост модели: ' + HEIGHT + ' см.';
        else if (/^На модели размер: —\.?$/.test(t)) p.textContent = 'На модели размер: ' + SIZE + '.';
      });
  }

  /* ── Избранное: без строки «Размер» ──
     Tilda при добавлении в избранное сама берёт первый размер (S) и
     показывает его. Прячем строку «Размер: …», цвет и артикул остаются. */
  function cleanWishlist() {
    document.querySelectorAll('.t1002__product-title__option > div').forEach(function (d) {
      if (/^\s*Размер\s*:/.test(d.textContent || '')) d.style.display = 'none';
    });
  }

  function tick() { fillModel(); cleanWishlist(); }

  document.addEventListener('DOMContentLoaded', tick);
  window.addEventListener('load', tick);
  [600, 1500, 3000].forEach(function (t) { setTimeout(tick, t); });

  var busy = false;
  new MutationObserver(function () {
    if (busy) return;
    busy = true;
    requestAnimationFrame(function () { tick(); busy = false; });
  }).observe(document.documentElement, { childList: true, subtree: true });
})();
</script>

<script>
(function () {
  // 7. К п. 6: шапка висит поверх страницы. Если страница начинается с фото
  //    (главная на телефоне), белая шапка закрыла бы его верх — сдвигаем
  //    первый блок вниз на высоту шапки (она разная: 50–78 px по ширине).
  //    Слайдер на весь экран при этом становится короче на ту же высоту.
  //    Короткую полоску-отступ сверху (белая полоса на «О бренде» на телефоне)
  //    не трогаем — она для того и стоит.
  //    ПК (от 1200 px) ничего не сдвигаем: там содержимое и так ниже шапки.
  //    Только решаем, какой быть шапке: белой (класс t2y-hdr-white) или
  //    прозрачной — если страница начинается с крупного фото во всю ширину.
  var MEDIA = 'img, video, iframe, .t-bgimg, .t-cover__carrier, [data-original], [data-content-cover-bg]';
  var moved = null, fsLock = null;

  // первый блок страницы, если у него фото под шапкой; иначе null.
  // shift — сколько добавить сверху, чтобы блок встал ровно под шапку
  function photoBlock(hh) {
    var recs = document.querySelectorAll('#allrecords .t-rec');
    for (var i = 0; i < recs.length; i++) {
      var r = recs[i];
      if (r.closest('header, footer') || r.offsetHeight < 5) continue;  // шапка, подвал, коды, скрытые
      var rt = r.getBoundingClientRect().top;
      // место блока без нашего сдвига (его не снимаем — страница не дёргается)
      var top = rt + window.pageYOffset - (r === moved ? parseFloat(r.style.marginTop) || 0 : 0);
      if (top >= hh || r.offsetHeight < 2 * hh) return null;   // уже ниже шапки / полоска-отступ
      var m = r.querySelectorAll(MEDIA);
      for (var j = 0; j < m.length; j++) {
        var b = m[j].getBoundingClientRect();
        if (b.width && b.height && top + (b.top - rt) < hh) return { rec: r, shift: Math.round(hh - top), media: b };
      }
      return null;
    }
    return null;
  }

  var watched = false;
  function fit() {
    var art = document.querySelector('#rec2498768581 .t396__artboard');
    // высоту шапки Tilda пересчитывает сама и позже нас — следим за ней
    if (art && !watched && window.ResizeObserver) { watched = true; new ResizeObserver(later).observe(art); }
    var desk = window.innerWidth >= 1200;
    var hh = art ? art.offsetHeight : 0;
    var p = hh ? photoBlock(hh) : null;
    if (desk) {
      // крупное фото — шире 60 % экрана прямо под шапкой
      var big = !!(p && p.media.width >= 0.6 * window.innerWidth);
      document.documentElement.classList.toggle('t2y-hdr-white', !big);
      p = null;
    } else {
      document.documentElement.classList.remove('t2y-hdr-white');
    }
    if (moved && (!p || p.rec !== moved)) {
      moved.style.marginTop = ''; moved.classList.remove('t2y-fs'); moved = null;
    }
    if (!p) return;
    var r = p.rec;
    if (r.style.marginTop !== p.shift + 'px') r.style.marginTop = p.shift + 'px';
    // слайдер Tilda на весь экран: высоту ему пишет сама Tilda (по высоте экрана) —
    // берём её и уменьшаем на сдвиг (CSS в п. 6)
    var w = r.querySelector('.t994__width-wrapper'), H = w ? parseFloat(w.style.height) || 0 : 0;
    if (H >= window.innerHeight - 2) r.classList.add('t2y-fs');
    if (H && r.classList.contains('t2y-fs')) {
      // в Safari при прокрутке сворачивается панель браузера и меняется высота
      // экрана — Tilda тут же меняет высоту слайдера, и всё под ним ездит
      // (заказчица 27.10: «стало всё двигаться»). Высоту берём при открытии
      // страницы и меняем только при смене ширины (поворот телефона)
      if (!fsLock || fsLock.w !== window.innerWidth) fsLock = { w: window.innerWidth, h: H };
      r.style.setProperty('--t2y-fs-h', (fsLock.h - p.shift) + 'px');
    }
    // блок может вырасти позже (слайдер Tilda запускается не сразу) — пересчитать
    if (window.ResizeObserver && !r.t2yWatch) { r.t2yWatch = true; new ResizeObserver(later).observe(r); }
    moved = r;
  }

  var t;
  function later() { clearTimeout(t); t = setTimeout(fit, 150); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fit);
  else fit();
  window.addEventListener('load', fit);
  [600, 2000].forEach(function (ms) { setTimeout(fit, ms); });
  window.addEventListener('resize', later);
  window.addEventListener('orientationchange', later);
})();

(function () {
  // 8. Список «Мужское» на ПК (Zero-блок) — в том же порядке, что раздел
  //    «Мужское» в мобильном меню (бургере). Порядок меняется в одном месте —
  //    в бургере (Контент меню), список на ПК подстраивается сам, двигать
  //    пункты в Zero-блоке не нужно. Пункт, которого нет в бургере, — в конце.
  //    Для «Женского» — добавить ['#rec2501320681', '/women/'] в LISTS.
  var LISTS = [['#rec2501315011', '/men/']];
  var TOP = 58, STEP = 27;   // место первого пункта и шаг, в единицах сетки Zero-блока

  function path(h) {
    try { return new URL(h, location.href).pathname.replace(/\/+$/, ''); } catch (e) { return ''; }
  }

  // Места пишем правилами CSS с !important: Tilda сама проставляет пунктам
  // top прямо в style (при запуске Zero-блока) и перетёрла бы значения в style.
  function sync() {
    var burger = [];
    document.querySelectorAll('#rec2501340841 a[href]').forEach(function (a) {
      var p = path(a.getAttribute('href'));
      if (burger.indexOf(p) < 0) burger.push(p);
    });
    var css = '';
    LISTS.forEach(function (L) {
      var rec = document.querySelector(L[0]);
      if (!rec) return;
      var items = [];
      rec.querySelectorAll('.tn-elem[data-elem-type="text"]').forEach(function (e) {
        var a = e.querySelector('a[href]');
        if (!a) return;
        var i = burger.indexOf(path(a.getAttribute('href')));
        var top = parseFloat(e.getAttribute('data-field-top-value')) || 0;
        items.push({ id: e.getAttribute('data-elem-id'), key: i < 0 ? 1000 + top : i });
      });
      if (!items.length) return;
      items.sort(function (a, b) { return a.key - b.key; });
      items.forEach(function (x, k) {
        // высота у всех одна: у копии пункта она бывает другой, и текст съезжает вниз
        css += L[0] + ' .tn-elem[data-elem-id="' + x.id + '"] { top: ' + (TOP + k * STEP) + 'px !important; height: 28px !important; }\n';
      });
      // белый фон списка — под число пунктов (последний пункт + 5 px снизу)
      var bg = rec.querySelector('.tn-elem[data-elem-type="shape"]');
      if (bg) css += L[0] + ' .tn-elem[data-elem-id="' + bg.getAttribute('data-elem-id') + '"] { height: ' +
                     ((items.length - 1) * STEP + 33) + 'px !important; }\n';
    });
    var st = document.getElementById('t2y-menu-order');
    if (!st) { st = document.createElement('style'); st.id = 't2y-menu-order'; document.head.appendChild(st); }
    st.textContent = '@media screen and (min-width: 641px) {\n' + css + '}';
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', sync);
  else sync();
})();
</script>

<!-- ════ 2Y4U: ШАПКА — «Мужское» / «Женское»: наведение раскрывает меню,
     клик ведёт в каталог /men и /women.  Версия 3, 25.10.2026 ════
     У кнопки Zero Block одна ссылка — #formanpopup / #forwomenpopup
     (всплывающее меню). Скрипт перехватывает КЛИК и ведёт в каталог,
     наведение не трогает — меню раскрывается как раньше.

     ВЕРСИЯ 3: вторая смотрела только координаты клика и уводила в каталог,
     даже когда поверх шапки открыта корзина (поиск, избранное) — клик
     проходил «сквозь» окно. Теперь сначала проверяем, что под курсором
     видна сама шапка. Если сверху другое окно — клик достаётся ему:
     корзина просто закрывается, как при любом клике мимо неё.

     Только для мыши. На телефонах и планшетах тап раскрывает меню, как было,
     поэтому «Всё мужское» / «Всё женское» в бургер-меню удалять НЕЛЬЗЯ.
     Ctrl/Cmd + клик — каталог в новой вкладке.

     Версия 2 стояла в HEAD — тот блок из HEAD УДАЛИТЬ: он срабатывает
     раньше этого и уводит сквозь корзину по-прежнему. -->
<script>
(function () {
  // хук всплывающего меню → куда вести по клику
  var MAP = {
    '#formanpopup':   '/men',
    '#forwomenpopup': '/women'
  };
  var HEADER = '#rec2498768581';   // Zero Block шапки
  // Что может лежать поверх слова, и клик всё равно наш: сама шапка и
  // выпадающие списки «Мужское» / «Женское» — их край заходит на слово.
  var OWN = HEADER + ', #rec2501314481, #rec2501320251';

  if (!window.matchMedia ||
      !window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;

  // Какой пункт шапки под точкой (x, y) — по прямоугольнику ссылки:
  // край выпадающего списка может лежать поверх самого слова.
  function hit(x, y) {
    for (var hook in MAP) {
      var links = document.querySelectorAll(HEADER + ' a[href="' + hook + '"]');
      for (var i = 0; i < links.length; i++) {
        var r = links[i].getBoundingClientRect();
        if (r.width > 0 && r.height > 0 &&
            x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {
          return MAP[hook];
        }
      }
    }
    return null;
  }

  // window + фаза перехвата — самая ранняя точка, куда приходит клик.
  window.addEventListener('click', function (e) {
    if (e.button !== 0) return;
    var url = hit(e.clientX, e.clientY);
    if (!url) return;

    // Сверху открыто другое окно (корзина, поиск, избранное) — клик его.
    var top = document.elementFromPoint(e.clientX, e.clientY);
    if (!top || !top.closest(OWN)) return;
    // Сверху другая ссылка (пункт выпадающего списка) — пусть работает она.
    var a = top.closest('a');
    if (a && !MAP[a.getAttribute('href')]) return;

    e.preventDefault();
    e.stopImmediatePropagation();

    if (e.ctrlKey || e.metaKey || e.shiftKey) {
      window.open(url, '_blank');
    } else {
      window.location.href = url;
    }
  }, true);
})();
</script>

     28.10: Winter tale крупнее (89 %), чёрная олимпийка Ватаным — на фон №2
     #EBEBEB и 80 %, копия «Олимпийки классической Space» — на фон №4 #F5F4EF

     Свой цвет товару — строка в BG: 'адрес-из-/p/': '#цвет' (кадр подстроится
     сам) или ['#цвет', размер] — свой размер вещи (доля высоты фото, 0 — как
     на фото). Убрать пробу — стереть строки (или весь этот кусок). -->
<style>
/* фон — только под фото, углы острые */
.t2y-bg .t-catalog__card__imgwrapper,
.t2y-bg .t-store__card__imgwrapper,
.t2y-bg .t2y-rel__img { background-color: var(--t2y-bg) !important; border-radius: 0 !important; }
/* фото на белом — белое становится цветом фона */
.t2y-bg .t-catalog__card__bgimg.js-product-img,
.t2y-bg .t-store__card__bgimg.js-product-img,
.t2y-bg .t2y-rel__img img:first-child,

/* единый кадр: размер и место вещи считает код */
.t2y-kadr { background-size: var(--t2y-bs) !important; background-position: var(--t2y-bp) !important; }
img.t2y-kadr {
  left: var(--t2y-l) !important; top: var(--t2y-t) !important; width: var(--t2y-w) !important;
  height: auto !important; max-width: none !important; object-fit: fill !important;
}
/* пока кадр считается (до 1,5 с) — фото не показываем, чтобы не прыгало */
.t2y-kadr-wait .js-product-img, .t2y-kadr-wait .t2y-rel__img img { opacity: 0 !important; }
</style>
<script>
(function () {
  // адрес из /p/ → цвет или [цвет, размер]: размер — доля высоты фото вместо
  // обычной по виду вещи (KADR); 0 — вещь как на фото, без кадра
  var BG = {
    // «Костюмы»: первые три — цвет №1
    'kostyum-shelk-vatanym':               '#F0ECEB',
    'kostyum-povsednevnyy-vatanym':        '#F0ECEB',
    'kostyum-vatanym-print':               '#F0ECEB',
    // оставшиеся два — цвет №3; Winter tale — «увеличиваем примерно до полосок» (28.10)
    'kostyum-sportivnyy-vatanym':          '#F7F7F7',
    'kostyum-hlopkovyy-winter-tale-siniy': ['#F7F7F7', 0.89],
    // олимпийка (толстовка на молнии) и брюки — цвет №1
    'tolstovka-hlopkovaya-siniy':          '#F0ECEB',
    'bryuki-sportivnye-siniy':             '#F0ECEB',
    // 28.10: чёрная олимпийка Ватаным — на фон №2, «уменьшаем примерно так»
    'olimpiyka-s-printom-vatanym-chernyy': ['#EBEBEB', 0.80],
    // 28.10: копия «Олимпийки классической Space» — на фон №4, «масштаб не меняем»
    'olimpiyka-klassicheskaya-space-siniy-test': ['#F5F4EF', 0]
  };
  // высота вещи — доля высоты фото (по названию или адресу товара);
  // ширина — не больше 84% фото, чтобы и по бокам оставался воздух
  var KADR = [
    [/костюм|kostyum/i, 0.80],
    [/брюки|шорты|bryuki|shorty/i, 0.70],
    [/олимпийк|толстовк|френч|худи|свитшот|бомбер|куртк|жилет|рубашк|футболк|джемпер|кардиган|olimpiyka|tolstovka|french/i, 0.56]
  ];
  var ALL = false;   // true — единый кадр и у карточек без фона

  function slug(u) { return String(u || '').split(/[?#]/)[0].replace(/\/+$/, '').split('/').pop().toLowerCase(); }
  function txt(el) { return el ? (el.textContent || '').replace(/\s+/g, ' ').trim() : ''; }

  // где вещь на фото: [слева, сверху, справа, снизу] в долях фото + высота/ширина
  // фото; 0 — фото не на белом. Для фото на фоне 27.10 уже посчитано (кадр сразу,
  // без ожидания); новые фото код посчитает сам и запомнит в браузере
  var CACHE = {
    '60c8c5dc5dde496d8f4cacba0e177b3b.webp': [0.356, 0.1, 0.644, 0.9, 1],
    '1ed6fff036d26b78c9683b6f5dbb130b.webp': [0.35, 0.1, 0.65, 0.9, 1],
    'de2c9a4faca9a05c241c02100a6b4369.webp': [0.363, 0.1, 0.638, 0.9, 1],
    '5a0abf6d4d860c3f71b7605093a27c45.webp': [0.363, 0.1, 0.638, 0.9, 1],
    '01bdacf3e9237c1457aed455f3d69d7b.webp': [0.275, 0.014, 0.725, 0.981, 1.333],
    'f22d8dbafb0cde00091a9d44924de437.webp': [0.05, 0.033, 0.95, 0.962, 1.333],
    'd116875c9460bdf51725c5b90ad903cc.webp': [0.231, 0.023, 0.756, 0.972, 1.333],
    'eda0860955d19fb99fa435e41b7dc139.webp': [0.019, 0.014, 0.981, 0.986, 1.333],
    '38504558d60ef88e4fdfc7c87ab738e4.webp': 0,
    // фото при наведении: на модели или срезаны — без кадра
    '4f8e70836f040726e45c79d102a18941.webp': 0, '3a65d8dcfd7e7682a2466fe3b7483184.webp': 0,
    'f1256deee02ec8ae37a2261590cec8cd.webp': 0, 'b845f1d1571711bbfa9cb31a5a20de63.webp': 0,
    '9b631e71e859c7552d28ef7ef3ea804f.webp': 0, '1de5a70e537a2297f7e6083e5bb3fa86.webp': 0
  }, waiting = {};
  try {
    var saved = JSON.parse(localStorage.getItem('t2y-kadr') || '{}') || {};
    for (var s in saved) if (saved.hasOwnProperty(s)) CACHE[s] = saved[s];
  } catch (e) {}
  function thumb(u) {
    var m = /^https?:\/\/static\.tildacdn\.[a-z]+\/([^/]+)\/([^/?#]+)$/.exec(u);
    return m ? 'https://thb.tildacdn.com/' + m[1] + '/-/resize/100x/' + m[2] : u;
  }
  function measure(u, done) {
    var k = slug(u);
    if (CACHE.hasOwnProperty(k)) return done(CACHE[k]);
    if (waiting[k]) return waiting[k].push(done);
    waiting[k] = [done];
    var im = new Image();
    im.crossOrigin = 'anonymous';
    im.onload = function () { finish(k, bounds(im)); };
    im.onerror = function () { finish(k, null); };
    im.src = thumb(u);
  }
  function finish(k, r) {
    if (r !== null) {
      CACHE[k] = r;
      try { localStorage.setItem('t2y-kadr', JSON.stringify(CACHE)); } catch (e) {}
    }
    var list = waiting[k];
    delete waiting[k];
    list.forEach(function (f) { f(r); });
  }
  function bounds(im) {
    try {
      var w = im.naturalWidth, h = im.naturalHeight, cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      var cx = cv.getContext('2d');
      cx.drawImage(im, 0, 0);
      var d = cx.getImageData(0, 0, w, h).data;
      var white = function (p) { return d[p * 4] >= 247 && d[p * 4 + 1] >= 247 && d[p * 4 + 2] >= 247; };
      if (!(white(0) && white(w - 1) && white((h - 1) * w) && white(h * w - 1))) return 0;
      var rows = new Uint16Array(h), cols = new Uint16Array(w), x, y, i;
      for (y = 0; y < h; y++) for (x = 0; x < w; x++) {
        i = (y * w + x) * 4;
        if (Math.min(d[i], d[i + 1], d[i + 2]) < 236) { rows[y]++; cols[x]++; }
      }
      var first = function (a) { for (var j = 0; j < a.length; j++) if (a[j] >= 2) return j; return -1; };
      var last = function (a) { for (var j = a.length - 1; j >= 0; j--) if (a[j] >= 2) return j + 1; return -1; };
      var x0 = first(cols), x1 = last(cols), y0 = first(rows), y1 = last(rows);
      // вещь упирается в край фото (срезана) — при уменьшении срез стал бы виден: не трогаем
      if (x0 <= 0 || y0 <= 0 || x1 >= w || y1 >= h) return 0;
      var r3 = function (v) { return Math.round(v * 1000) / 1000; };
      return [r3(x0 / w), r3(y0 / h), r3(x1 / w), r3(y1 / h), r3(h / w)];
    } catch (e) { return null; }   // фото не отдалось для чтения — без кадра
  }

  // ставим вещь: высота — f от высоты фото, по центру. Фото-фон Tilda —
  // размером и позицией фона; наши <img> — шириной и отступами
  function pc(v) { return Math.round(v * 10000) / 100 + '%'; }
  // пропорция плитки (высота/ширина) — одна на блок: меряем один раз, без лишних пересчётов страницы
  var ASPECT = {};
  function aspect(box, key) {
    if (!ASPECT[key]) {
      if (!box.offsetWidth) return 4 / 3;
      ASPECT[key] = box.offsetHeight / box.offsetWidth;
    }
    return ASPECT[key];
  }
  function place(el, r, f) {
    var img = el.tagName === 'IMG', box = img ? el.parentNode : el;
    var c = aspect(box, img ? 'rel' : el.parentNode.className);
    var pw = r[2] - r[0], ph = r[3] - r[1], a = r[4];
    var R = Math.min(f * c / (ph * a), 0.84 / pw);   // ширина фото в долях ширины плитки
    // фото ровно в ширину или высоту плитки — позицию в % не задать: чуть меньше
    if (!img && Math.abs(1 - R) < 0.01) R *= 0.985;
    if (!img && Math.abs(c - a * R) < 0.01) R *= 0.985;
    var left = 0.5 - (r[0] + r[2]) / 2 * R, top = c / 2 - (r[1] + r[3]) / 2 * a * R;
    if (img) {
      el.style.setProperty('--t2y-w', pc(R));
      el.style.setProperty('--t2y-l', pc(left));
      el.style.setProperty('--t2y-t', pc(top / c));
    } else {
      el.style.setProperty('--t2y-bs', pc(R) + ' auto');
      el.style.setProperty('--t2y-bp', pc(left / (1 - R)) + ' ' + pc(top / (c - a * R)));
    }
    el.classList.add('t2y-kadr');
  }

  function frame(c, href, size) {
    if (size === 0) { c.t2yKadr = true; return; }   // как на фото
    var t = href + ' ' + txt(c.querySelector('.t-catalog__card__title, .t-store__card__title, .t2y-rel__name'));
    var f = size || 0;
    for (var i = 0; i < KADR.length && !f; i++) if (KADR[i][0].test(t)) f = KADR[i][1];
    if (!f) return;
    var els = [].slice.call(c.querySelectorAll('.js-product-img, .t-catalog__card__bgimg_second, .t-store__card__bgimg_second, .t2y-rel__img img'))
      .filter(function (el) { return el.getAttribute('data-original') || el.getAttribute('data-orig'); });
    if (!els.length) return;   // фото ещё не подставлены — попробуем при следующей проверке
    c.t2yKadr = true;
    // главное фото прячем, пока не посчитан его кадр; фото при наведении — не ждём
    var main = function (el) { return el.classList.contains('js-product-img') || (el.tagName === 'IMG' && !el.previousElementSibling); };
    var left = els.filter(main).length;
    c.classList.add('t2y-kadr-wait');
    var show = function () { c.classList.remove('t2y-kadr-wait'); };
    var timer = setTimeout(show, 1500);
    if (!left) { clearTimeout(timer); show(); }
    els.forEach(function (el) {
      measure(el.getAttribute('data-original') || el.getAttribute('data-orig'), function (r) {
        if (r) place(el, r, f);
        if (main(el) && --left === 0) { clearTimeout(timer); show(); }
      });
    });
  }

  function paint() {
    document.querySelectorAll('.t-catalog__card, .t-store__card, .t2y-rel__card').forEach(function (c) {
      if (c.t2yKadr) return;
      var a = c.matches('a[href]') ? c : c.querySelector('a[href*="/p/"]');
      var href = a ? slug(a.getAttribute('href')) : '';
      var v = BG[href], col = v && (typeof v === 'string' ? v : v[0]);
      var size = v && typeof v !== 'string' ? v[1] : undefined;
      if (col && !c.classList.contains('t2y-bg')) {
        c.style.setProperty('--t2y-bg', col);
        c.classList.add('t2y-bg');
      }
      if (col || (ALL && href)) frame(c, href, size);
    });
  }

  // каталоги Tilda и «Возможно, вам понравится» появляются позже — красим по мере появления
  var pending = false;
  function later() { if (pending) return; pending = true; setTimeout(function () { pending = false; paint(); }, 250); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', paint); else paint();
  window.addEventListener('load', paint);
  [1500, 4000, 8000].forEach(function (ms) { setTimeout(paint, ms); });
  if (window.MutationObserver) new MutationObserver(later).observe(document.body, { childList: true, subtree: true });
})();
</script>
