<!-- ════ 2Y4U: ПАРАМЕТРЫ МОДЕЛИ + ИЗБРАННОЕ БЕЗ РАЗМЕРА ════ -->
<script>
(function () {
  /* ── Параметры модели на фото ──
     На карточках в аккордеоне стоят прочерки («Рост модели: — см.»).
     Заказчица: у всех мужских — 188 см, размер XL/L. Меняем ТОЛЬКО прочерки:
     если на какой-то карточке вписать свои цифры, скрипт их не тронет. */
  var HEIGHT = '188';
  var SIZE = 'XL/L';

  function fillModel() {
    var src = document.querySelector('.t2y-acc-source');
    if (!src || src.getAttribute('data-crumb-parent') !== 'Мужское') return;
    document.querySelectorAll('.t2y-acc-source p, .product-popup-accordion p')
      .forEach(function (p) {
        var t = (p.textContent || '').replace(/\s+/g, ' ').trim();
        if (/^Рост модели: — см\.?$/.test(t)) p.textContent = 'Рост модели: ' + HEIGHT + ' см.';
        else if (/^На модели размер: —\.?$/.test(t)) p.textContent = 'На модели размер: ' + SIZE + '.';
      });
  }

  /* ── Избранное: без строки «Размер» ──
     Tilda при добавлении в избранное сама берёт первый размер (S) и
     показывает его. Прячем строку «Размер: …», цвет и артикул остаются. */
  function cleanWishlist() {
    document.querySelectorAll('.t1002__product-title__option > div').forEach(function (d) {
      if (/^\s*Размер\s*:/.test(d.textContent || '')) d.style.display = 'none';
    });
  }

  function tick() { fillModel(); cleanWishlist(); }

  document.addEventListener('DOMContentLoaded', tick);
  window.addEventListener('load', tick);
  [600, 1500, 3000].forEach(function (t) { setTimeout(tick, t); });

  var busy = false;
  new MutationObserver(function () {
    if (busy) return;
    busy = true;
    requestAnimationFrame(function () { tick(); busy = false; });
  }).observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
<!-- ════ конец: параметры модели + избранное ════ -->

<script>
(function () {
  var POLICY_URL = '/politika-obrabotki-persdannyh';

  function read() {
    var m = document.cookie.match(/(?:^|;\s*)t2y_cc=(all|nec)/);
    return m ? m[1] : null;
  }
  window.t2yCookieOK = function () { return read() === 'all'; };

  function save(v) {
    document.cookie = 't2y_cc=' + v + '; max-age=31536000; path=/; SameSite=Lax';
    try { document.dispatchEvent(new CustomEvent('t2y:cookie', { detail: v })); } catch (e) {}
  }

  function show() {
    if (read() || document.querySelector('.t2y-cc')) return;
    var wrap = document.createElement('div');
    wrap.className = 't2y-cc';
    wrap.setAttribute('role', 'dialog');
    wrap.setAttribute('aria-modal', 'true');
    wrap.setAttribute('aria-labelledby', 't2y-cc-title');
    wrap.innerHTML =
      '<div class="t2y-cc__box">' +
        '<p class="t2y-cc__title" id="t2y-cc-title">Файлы cookie</p>' +
        '<p class="t2y-cc__text">Мы используем cookie, чтобы сайт работал, ' +
          'и для анализа посещаемости. Подробнее — в <a href="' + POLICY_URL + '">' +
          'политике обработки персональных данных</a>.</p>' +
        '<button type="button" class="t2y-cc__btn" data-v="all">Принять</button>' +
        '<button type="button" class="t2y-cc__btn t2y-cc__btn_ghost" data-v="nec">Только необходимые</button>' +
      '</div>';
    wrap.addEventListener('click', function (e) {
      var b = e.target.closest('[data-v]');
      if (!b) return;
      save(b.getAttribute('data-v'));
      wrap.remove();
    });
    document.body.appendChild(wrap);
  }

  /* небольшая пауза, чтобы окно не мешало первой отрисовке страницы */
  function start() { setTimeout(show, 700); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>

<!-- ════ 2Y4U: ССЫЛКИ В ГАЛОЧКАХ СОГЛАСИЯ (корзина и формы) ════
     В «Лейбле» галочки Tilda ссылку не пропускает — показывает код буквами.
     Поэтому в лейбле пишем простой текст, а нужные слова делает ссылкой этот
     скрипт. Если в лейбле остался код <a …> — он уберёт теги сам.
     Новая галочка со ссылкой — добавить строку в LINKS. -->
<style>
.t-checkbox__control a.t2y-consent-link {
  color: inherit !important;
  text-decoration: underline !important;
  text-underline-offset: 2px;
}
</style>
<script>
(function () {
  /* фраза в тексте галочки → страница */
  var LINKS = [
    { phrase: 'рекламную информацию', url: '/soglasie' },
    { phrase: 'политикой обработки персональных данных', url: '/politika-obrabotki-persdannyh' }
  ];

  function linkify() {
    document.querySelectorAll('.t-checkbox__control > span').forEach(function (span) {
      if (span.querySelector('a.t2y-consent-link')) return;
      var text = (span.textContent || '').replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
      var hit = null, at = -1;
      LINKS.forEach(function (l) {
        var i = text.indexOf(l.phrase);
        if (i >= 0 && !hit) { hit = l; at = i; }
      });
      if (!hit) {
        if (text !== span.textContent) span.textContent = text;
        return;
      }
      var a = document.createElement('a');
      a.className = 't2y-consent-link';
      a.href = hit.url;
      a.target = '_blank';  /* в новой вкладке — корзина и форма не теряются */
      a.rel = 'noopener';
      a.textContent = hit.phrase;
      span.textContent = '';
      span.appendChild(document.createTextNode(text.slice(0, at)));
      span.appendChild(a);
      span.appendChild(document.createTextNode(text.slice(at + hit.phrase.length)));
    });
  }

  document.addEventListener('DOMContentLoaded', linkify);
  window.addEventListener('load', linkify);
  [800, 2000, 4000].forEach(function (t) { setTimeout(linkify, t); });
})();
</script>
<!-- ════ конец: ссылки в галочках согласия ════ -->

     (всплывающее меню). Скрипт перехватывает КЛИК и ведёт в каталог,
     наведение не трогает — меню раскрывается как раньше.

     ВЕРСИЯ 3: вторая смотрела только координаты клика и уводила в каталог,
     даже когда поверх шапки открыта корзина (поиск, избранное) — клик
     проходил «сквозь» окно. Теперь сначала проверяем, что под курсором
     видна сама шапка. Если сверху другое окно — клик достаётся ему:
     корзина просто закрывается, как при любом клике мимо неё.

     Только для мыши. На телефонах и планшетах тап раскрывает меню, как было,
     поэтому «Всё мужское» / «Всё женское» в бургер-меню удалять НЕЛЬЗЯ.
     Ctrl/Cmd + клик — каталог в новой вкладке.

     Версия 2 стояла в HEAD — тот блок из HEAD УДАЛИТЬ: он срабатывает
     раньше этого и уводит сквозь корзину по-прежнему. -->
<script>
(function () {
  // хук всплывающего меню → куда вести по клику
  var MAP = {
    '#formanpopup':   '/men',
    '#forwomenpopup': '/women'
  };
  var HEADER = '#rec2498768581';   // Zero Block шапки
  // Что может лежать поверх слова, и клик всё равно наш: сама шапка и
  // выпадающие списки «Мужское» / «Женское» — их край заходит на слово.
  var OWN = HEADER + ', #rec2501314481, #rec2501320251';

  if (!window.matchMedia ||
      !window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;

  // Какой пункт шапки под точкой (x, y) — по прямоугольнику ссылки:
  // край выпадающего списка может лежать поверх самого слова.
  function hit(x, y) {
    for (var hook in MAP) {
      var links = document.querySelectorAll(HEADER + ' a[href="' + hook + '"]');
      for (var i = 0; i < links.length; i++) {
        var r = links[i].getBoundingClientRect();
        if (r.width > 0 && r.height > 0 &&
            x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {
          return MAP[hook];
        }
      }
    }
    return null;
  }

  // window + фаза перехвата — самая ранняя точка, куда приходит клик.
  window.addEventListener('click', function (e) {
    if (e.button !== 0) return;
    var url = hit(e.clientX, e.clientY);
    if (!url) return;

    // Сверху открыто другое окно (корзина, поиск, избранное) — клик его.
    var top = document.elementFromPoint(e.clientX, e.clientY);
    if (!top || !top.closest(OWN)) return;
    // Сверху другая ссылка (пункт выпадающего списка) — пусть работает она.
    var a = top.closest('a');
    if (a && !MAP[a.getAttribute('href')]) return;

    e.preventDefault();
    e.stopImmediatePropagation();

    if (e.ctrlKey || e.metaKey || e.shiftKey) {
      window.open(url, '_blank');
    } else {
      window.location.href = url;
    }
  }, true);
})();
</script>
<!-- ════ конец: клик по «Мужское» / «Женское» ════ -->
