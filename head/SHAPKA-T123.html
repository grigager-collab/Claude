<!-- ════ 2Y4U: ПАРАМЕТРЫ МОДЕЛИ + ИЗБРАННОЕ БЕЗ РАЗМЕРА ════ -->
<script>
(function () {
  /* ── Параметры модели на фото ──
     На карточках в аккордеоне стоят прочерки («Рост модели: — см.»).
     Заказчица: у всех мужских — 188 см, размер XL/L. Меняем ТОЛЬКО прочерки:
     если на какой-то карточке вписать свои цифры, скрипт их не тронет. */
  var HEIGHT = '188';
  var SIZE = 'XL/L';

  function fillModel() {
    var src = document.querySelector('.t2y-acc-source');
    if (!src || src.getAttribute('data-crumb-parent') !== 'Мужское') return;
    document.querySelectorAll('.t2y-acc-source p, .product-popup-accordion p')
      .forEach(function (p) {
        var t = (p.textContent || '').replace(/\s+/g, ' ').trim();
        if (/^Рост модели: — см\.?$/.test(t)) p.textContent = 'Рост модели: ' + HEIGHT + ' см.';
        else if (/^На модели размер: —\.?$/.test(t)) p.textContent = 'На модели размер: ' + SIZE + '.';
      });
  }

  /* ── Избранное: без строки «Размер» ──
     Tilda при добавлении в избранное сама берёт первый размер (S) и
     показывает его. Прячем строку «Размер: …», цвет и артикул остаются. */
  function cleanWishlist() {
    document.querySelectorAll('.t1002__product-title__option > div').forEach(function (d) {
      if (/^\s*Размер\s*:/.test(d.textContent || '')) d.style.display = 'none';
    });
  }

  function tick() { fillModel(); cleanWishlist(); }

  document.addEventListener('DOMContentLoaded', tick);
  window.addEventListener('load', tick);
  [600, 1500, 3000].forEach(function (t) { setTimeout(tick, t); });

  var busy = false;
  new MutationObserver(function () {
    if (busy) return;
    busy = true;
    requestAnimationFrame(function () { tick(); busy = false; });
  }).observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
<!-- ════ конец: параметры модели + избранное ════ -->

<script>
(function () {
  var POLICY_URL = '/politika-obrabotki-persdannyh';

  function read() {
    var m = document.cookie.match(/(?:^|;\s*)t2y_cc=(all|nec)/);
    return m ? m[1] : null;
  }
  window.t2yCookieOK = function () { return read() === 'all'; };

  function save(v) {
    document.cookie = 't2y_cc=' + v + '; max-age=31536000; path=/; SameSite=Lax';
    try { document.dispatchEvent(new CustomEvent('t2y:cookie', { detail: v })); } catch (e) {}
  }

  function show() {
    if (read() || document.querySelector('.t2y-cc')) return;
    var wrap = document.createElement('div');
    wrap.className = 't2y-cc';
    wrap.setAttribute('role', 'dialog');
    wrap.setAttribute('aria-modal', 'true');
    wrap.setAttribute('aria-labelledby', 't2y-cc-title');
    wrap.innerHTML =
      '<div class="t2y-cc__box">' +
        '<p class="t2y-cc__title" id="t2y-cc-title">Файлы cookie</p>' +
        '<p class="t2y-cc__text">Мы используем cookie, чтобы сайт работал, ' +
          'и для анализа посещаемости. Подробнее — в <a href="' + POLICY_URL + '">' +
          'политике обработки персональных данных</a>.</p>' +
        '<button type="button" class="t2y-cc__btn" data-v="all">Принять</button>' +
        '<button type="button" class="t2y-cc__btn t2y-cc__btn_ghost" data-v="nec">Только необходимые</button>' +
      '</div>';
    wrap.addEventListener('click', function (e) {
      var b = e.target.closest('[data-v]');
      if (!b) return;
      save(b.getAttribute('data-v'));
      wrap.remove();
    });
    document.body.appendChild(wrap);
  }

  /* небольшая пауза, чтобы окно не мешало первой отрисовке страницы */
  function start() { setTimeout(show, 700); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>

<!-- ════ 2Y4U: ССЫЛКИ В ГАЛОЧКАХ СОГЛАСИЯ (корзина и формы) ════
     В «Лейбле» галочки Tilda ссылку не пропускает — показывает код буквами.
     Поэтому в лейбле пишем простой текст, а нужные слова делает ссылкой этот
     скрипт. Если в лейбле остался код <a …> — он уберёт теги сам.
     Новая галочка со ссылкой — добавить строку в LINKS. -->
<style>
.t-checkbox__control a.t2y-consent-link {
  color: inherit !important;
  text-decoration: underline !important;
  text-underline-offset: 2px;
}
</style>
<script>
(function () {
  /* фраза в тексте галочки → страница */
  var LINKS = [
    { phrase: 'рекламную информацию', url: '/soglasie' },
    { phrase: 'политикой обработки персональных данных', url: '/politika-obrabotki-persdannyh' }
  ];

  function linkify() {
    document.querySelectorAll('.t-checkbox__control > span').forEach(function (span) {
      if (span.querySelector('a.t2y-consent-link')) return;
      var text = (span.textContent || '').replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
      var hit = null, at = -1;
      LINKS.forEach(function (l) {
        var i = text.indexOf(l.phrase);
        if (i >= 0 && !hit) { hit = l; at = i; }
      });
      if (!hit) {
        if (text !== span.textContent) span.textContent = text;
        return;
      }
      var a = document.createElement('a');
      a.className = 't2y-consent-link';
      a.href = hit.url;
      a.target = '_blank';  /* в новой вкладке — корзина и форма не теряются */
      a.rel = 'noopener';
      a.textContent = hit.phrase;
      span.textContent = '';
      span.appendChild(document.createTextNode(text.slice(0, at)));
      span.appendChild(a);
      span.appendChild(document.createTextNode(text.slice(at + hit.phrase.length)));
    });
  }

  document.addEventListener('DOMContentLoaded', linkify);
  window.addEventListener('load', linkify);
  [800, 2000, 4000].forEach(function (t) { setTimeout(linkify, t); });
})();
</script>

<script>
(function () {
  // 7. К п. 6: шапка висит поверх страницы. Если страница начинается с фото
  //    (главная на телефоне), белая шапка закрыла бы его верх — сдвигаем
  //    первый блок вниз на высоту шапки (она разная: 50–78 px по ширине).
  //    Слайдер на весь экран при этом становится короче на ту же высоту.
  //    Короткую полоску-отступ сверху (белая полоса на «О бренде» на телефоне)
  //    не трогаем — она для того и стоит. ПК не трогаем.
  var MEDIA = 'img, video, iframe, .t-bgimg, .t-cover__carrier, [data-original], [data-content-cover-bg]';
  var moved = null;

  // первый блок страницы, если у него фото под шапкой; иначе null.
  // shift — сколько добавить сверху, чтобы блок встал ровно под шапку
  function photoBlock(hh) {
    var recs = document.querySelectorAll('#allrecords .t-rec');
    for (var i = 0; i < recs.length; i++) {
      var r = recs[i];
      if (r.closest('header, footer') || r.offsetHeight < 5) continue;  // шапка, подвал, коды, скрытые
      var rt = r.getBoundingClientRect().top;
      // место блока без нашего сдвига (его не снимаем — страница не дёргается)
      var top = rt + window.pageYOffset - (r === moved ? parseFloat(r.style.marginTop) || 0 : 0);
      if (top >= hh || r.offsetHeight < 2 * hh) return null;   // уже ниже шапки / полоска-отступ
      var m = r.querySelectorAll(MEDIA);
      for (var j = 0; j < m.length; j++) {
        var b = m[j].getBoundingClientRect();
        if (b.width && b.height && top + (b.top - rt) < hh) return { rec: r, shift: Math.round(hh - top) };
      }
      return null;
    }
    return null;
  }

  var watched = false;
  function fit() {
    var art = document.querySelector('#rec2498768581 .t396__artboard');
    // высоту шапки Tilda пересчитывает сама и позже нас — следим за ней
    if (art && !watched && window.ResizeObserver) { watched = true; new ResizeObserver(later).observe(art); }
    var hh = art && window.innerWidth <= 1199 ? art.offsetHeight : 0;
    var p = hh ? photoBlock(hh) : null;
    if (moved && (!p || p.rec !== moved)) {
      moved.style.marginTop = ''; moved.classList.remove('t2y-fs'); moved = null;
    }
    if (!p) return;
    var r = p.rec;
    if (r.style.marginTop !== p.shift + 'px') r.style.marginTop = p.shift + 'px';
    // слайдер Tilda на весь экран: высоту ему пишет сама Tilda (по высоте экрана) —
    // берём её и уменьшаем на сдвиг (CSS в п. 6)
    var w = r.querySelector('.t994__width-wrapper'), H = w ? parseFloat(w.style.height) || 0 : 0;
    if (H >= window.innerHeight - 2) r.classList.add('t2y-fs');
    if (H && r.classList.contains('t2y-fs')) r.style.setProperty('--t2y-fs-h', (H - p.shift) + 'px');
    // блок может вырасти позже (слайдер Tilda запускается не сразу) — пересчитать
    if (window.ResizeObserver && !r.t2yWatch) { r.t2yWatch = true; new ResizeObserver(later).observe(r); }
    moved = r;
  }

  var t;
  function later() { clearTimeout(t); t = setTimeout(fit, 150); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fit);
  else fit();
  window.addEventListener('load', fit);
  [600, 2000].forEach(function (ms) { setTimeout(fit, ms); });
  window.addEventListener('resize', later);
  window.addEventListener('orientationchange', later);
})();

(function () {
  // 8. Список «Мужское» на ПК (Zero-блок) — в том же порядке, что раздел
  //    «Мужское» в мобильном меню (бургере). Порядок меняется в одном месте —
  //    в бургере (Контент меню), список на ПК подстраивается сам, двигать
  //    пункты в Zero-блоке не нужно. Пункт, которого нет в бургере, — в конце.
  //    Для «Женского» — добавить ['#rec2501320681', '/women/'] в LISTS.
  var LISTS = [['#rec2501315011', '/men/']];
  var TOP = 58, STEP = 27;   // место первого пункта и шаг, в единицах сетки Zero-блока

  function path(h) {
    try { return new URL(h, location.href).pathname.replace(/\/+$/, ''); } catch (e) { return ''; }
  }

  // Места пишем правилами CSS с !important: Tilda сама проставляет пунктам
  // top прямо в style (при запуске Zero-блока) и перетёрла бы значения в style.
  function sync() {
    var burger = [];
    document.querySelectorAll('#rec2501340841 a[href]').forEach(function (a) {
      var p = path(a.getAttribute('href'));
      if (burger.indexOf(p) < 0) burger.push(p);
    });
    var css = '';
    LISTS.forEach(function (L) {
      var rec = document.querySelector(L[0]);
      if (!rec) return;
      var items = [];
      rec.querySelectorAll('.tn-elem[data-elem-type="text"]').forEach(function (e) {
        var a = e.querySelector('a[href]');
        if (!a) return;
        var i = burger.indexOf(path(a.getAttribute('href')));
        var top = parseFloat(e.getAttribute('data-field-top-value')) || 0;
        items.push({ id: e.getAttribute('data-elem-id'), key: i < 0 ? 1000 + top : i });
      });
      if (!items.length) return;
      items.sort(function (a, b) { return a.key - b.key; });
      items.forEach(function (x, k) {
        // высота у всех одна: у копии пункта она бывает другой, и текст съезжает вниз
        css += L[0] + ' .tn-elem[data-elem-id="' + x.id + '"] { top: ' + (TOP + k * STEP) + 'px !important; height: 28px !important; }\n';
      });
      // белый фон списка — под число пунктов (последний пункт + 5 px снизу)
      var bg = rec.querySelector('.tn-elem[data-elem-type="shape"]');
      if (bg) css += L[0] + ' .tn-elem[data-elem-id="' + bg.getAttribute('data-elem-id') + '"] { height: ' +
                     ((items.length - 1) * STEP + 33) + 'px !important; }\n';
    });
    var st = document.getElementById('t2y-menu-order');
    if (!st) { st = document.createElement('style'); st.id = 't2y-menu-order'; document.head.appendChild(st); }
    st.textContent = '@media screen and (min-width: 641px) {\n' + css + '}';
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', sync);
  else sync();
})();
</script>

<!-- ════ 2Y4U: ШАПКА — «Мужское» / «Женское»: наведение раскрывает меню,
     клик ведёт в каталог /men и /women.  Версия 3, 25.10.2026 ════
     У кнопки Zero Block одна ссылка — #formanpopup / #forwomenpopup
     (всплывающее меню). Скрипт перехватывает КЛИК и ведёт в каталог,
     наведение не трогает — меню раскрывается как раньше.

     ВЕРСИЯ 3: вторая смотрела только координаты клика и уводила в каталог,
     даже когда поверх шапки открыта корзина (поиск, избранное) — клик
     проходил «сквозь» окно. Теперь сначала проверяем, что под курсором
     видна сама шапка. Если сверху другое окно — клик достаётся ему:
     корзина просто закрывается, как при любом клике мимо неё.

     Только для мыши. На телефонах и планшетах тап раскрывает меню, как было,
     поэтому «Всё мужское» / «Всё женское» в бургер-меню удалять НЕЛЬЗЯ.
     Ctrl/Cmd + клик — каталог в новой вкладке.

     Версия 2 стояла в HEAD — тот блок из HEAD УДАЛИТЬ: он срабатывает
     раньше этого и уводит сквозь корзину по-прежнему. -->
<script>
(function () {
  // хук всплывающего меню → куда вести по клику
  var MAP = {
    '#formanpopup':   '/men',
    '#forwomenpopup': '/women'
  };
  var HEADER = '#rec2498768581';   // Zero Block шапки
  // Что может лежать поверх слова, и клик всё равно наш: сама шапка и
  // выпадающие списки «Мужское» / «Женское» — их край заходит на слово.
  var OWN = HEADER + ', #rec2501314481, #rec2501320251';

  if (!window.matchMedia ||
      !window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;

  // Какой пункт шапки под точкой (x, y) — по прямоугольнику ссылки:
  // край выпадающего списка может лежать поверх самого слова.
  function hit(x, y) {
    for (var hook in MAP) {
      var links = document.querySelectorAll(HEADER + ' a[href="' + hook + '"]');
      for (var i = 0; i < links.length; i++) {
        var r = links[i].getBoundingClientRect();
        if (r.width > 0 && r.height > 0 &&
            x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {
          return MAP[hook];
        }
      }
    }
    return null;
  }

  // window + фаза перехвата — самая ранняя точка, куда приходит клик.
  window.addEventListener('click', function (e) {
    if (e.button !== 0) return;
    var url = hit(e.clientX, e.clientY);
    if (!url) return;

    // Сверху открыто другое окно (корзина, поиск, избранное) — клик его.
    var top = document.elementFromPoint(e.clientX, e.clientY);
    if (!top || !top.closest(OWN)) return;
    // Сверху другая ссылка (пункт выпадающего списка) — пусть работает она.
    var a = top.closest('a');
    if (a && !MAP[a.getAttribute('href')]) return;

    e.preventDefault();
    e.stopImmediatePropagation();

    if (e.ctrlKey || e.metaKey || e.shiftKey) {
      window.open(url, '_blank');
    } else {
      window.location.href = url;
    }
  }, true);
})();
</script>

<script>
(function () {
  if (!/^\/p\//.test(location.pathname)) return;

  var PARTS = ['364366089229'];   // каталог «Мужское»; добавить «Женское», когда появятся товары
  var MAX = 8;
  var API = 'https://store.tildaapi.com/api/getproductslist/?getoptions=true&slice=1&size=100&storepartuid=';
  var WORDS = [['volcano', 'volcano'], ['ocean', 'ocean'], ['space', 'space'], ['phantom', 'phantom'],
               ['milky', 'milky'], ['ironman', 'grey'], ['winter tale', 'space']];
  var VALUES = { 'коричневый': 'volcano', 'чёрный': 'phantom', 'черный': 'phantom', 'белый': 'milky',
                 'молочный': 'milky', 'серый': 'grey', 'синий': 'space', 'зелёный': 'green',
                 'зеленый': 'green', 'бежевый': 'beige' };

  function color(p) {
    var t = (p.title || '').toLowerCase();
    for (var i = 0; i < WORDS.length; i++) if (t.indexOf(WORDS[i][0]) >= 0) return WORDS[i][1];
    var ed = p.editions || [];
    for (var j = 0; j < ed.length; j++) {
      var v = VALUES[String(ed[j]['Цвет'] || '').toLowerCase().trim()];
      if (v) return v;
    }
    return '';
  }
  function kind(p) {
    var t = (p.title || '').toLowerCase();
    if (/костюм|комплект/.test(t)) return 'suit';
    if (/брюки|шорты/.test(t)) return 'bottom';
    if (/пиджак|френч|жакет/.test(t)) return 'blazer';
    if (/футболк|лонгслив|жилет/.test(t)) return 'basic';
    return 'top';
  }
  function path(u) {
    try { u = decodeURI(new URL(u, location.href).pathname); } catch (e) { u = String(u || ''); }
    return u.replace(/\/+$/, '').toLowerCase();
  }
  // разделы товара каталог отдаёт строкой вида «[364366089229,184306918613]»
  function parts(p) { return String(p.partuids || '').match(/\d+/g) || []; }

  function pick(all, cur) {
    var c = color(cur), k = kind(cur), here = path(cur.url), out = [], seen = {};
    var others = all.filter(function (p) { return p.url && path(p.url) !== here; });
    function add(list) {
      list.forEach(function (p) { if (out.length < MAX && !seen[p.uid]) { seen[p.uid] = 1; out.push(p); } });
    }
    var same = others.filter(function (p) { return c && color(p) === c; });
    add(same.filter(function (p) { return kind(p) !== k; }));   // другие вещи этого цвета
    add(same.filter(function (p) { return kind(p) === k; }));   // другие модели этого цвета
    add(others.filter(function (p) { return kind(p) === 'basic'; }));   // футболки, жилеты
    var sub = parts(cur).filter(function (id) { return PARTS.indexOf(id) < 0; });
    add(others.filter(function (p) {                            // добираем из того же раздела
      return parts(p).some(function (id) { return sub.indexOf(id) >= 0; });
    }));
    return out;
  }

  function img(u, w) {
    var m = String(u || '').match(/^https:\/\/static\.tildacdn\.com\/([^\/]+)\/(.+)$/);
    return m ? 'https://optim.tildacdn.com/' + m[1] + '/-/resize/' + w + 'x/-/format/webp/' + m[2] : u;
  }
  function price(p) {
    var n = Math.round(parseFloat(p.price));
    return isNaN(n) || !n ? '' : n.toLocaleString('ru-RU') + ' р.';
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch];
    });
  }

  function load() {
    var KEY = 't2y_cat_v1';
    try {
      var c = JSON.parse(sessionStorage.getItem(KEY) || 'null');
      if (c && Date.now() - c.t < 10 * 60 * 1000) return Promise.resolve(c.list);
    } catch (e) {}
    return Promise.all(PARTS.map(function (id) {
      return fetch(API + id + '&c=' + Date.now()).then(function (r) { return r.json(); })
        .then(function (d) { return d.products || []; });
    })).then(function (lists) {
      var list = [].concat.apply([], lists);
      try { sessionStorage.setItem(KEY, JSON.stringify({ t: Date.now(), list: list })); } catch (e) {}
      return list;
    });
  }

  function arrows(box, row) {
    var svg = function (d) {
      return '<svg viewBox="0 0 18 18" fill="none"><path d="' + d + '" stroke="#111" stroke-width="1.5"/></svg>';
    };
    var prev = document.createElement('button'), next = document.createElement('button');
    prev.type = next.type = 'button';

    next.className = 't2y-rel__nav t2y-rel__nav_next'; next.setAttribute('aria-label', 'Вперёд');
    prev.innerHTML = svg('M11 3L5 9l6 6'); next.innerHTML = svg('M7 3l6 6-6 6');
    box.appendChild(prev); box.appendChild(next);
    prev.onclick = function () { row.scrollBy({ left: -row.clientWidth, behavior: 'smooth' }); };
    next.onclick = function () { row.scrollBy({ left: row.clientWidth, behavior: 'smooth' }); };
    function state() {
      var top = row.querySelector('.t2y-rel__img') || row.firstElementChild;
      if (top) prev.style.top = next.style.top = (top.offsetHeight / 2) + 'px';
      box.classList.toggle('t2y-rel_scroll', row.scrollWidth > row.clientWidth + 2);
      box.classList.toggle('t2y-rel_start', row.scrollLeft < 4);
      box.classList.toggle('t2y-rel_end', row.scrollLeft + row.clientWidth > row.scrollWidth - 4);
    }
    row.addEventListener('scroll', state);
    window.addEventListener('resize', state);
    state(); setTimeout(state, 600);
  }
  window.t2yArrows = arrows;   // стрелки нужны и ряду коллажей (часть 11)

  function render(rec, items) {
    var html = '<div class="t2y-rel__row">';
    items.forEach(function (p) {
      var g = [];
      try { g = JSON.parse(p.gallery || '[]'); } catch (e) {}
      var a = g[0] && g[0].img, b = g[1] && g[1].img;
      html += '<a class="t2y-rel__card" href="' + esc(p.url) + '">' +
        '<div class="t2y-rel__img">' +
          (a ? '<img alt="' + esc(p.title) + '" src="' + img(a, 600) + '" data-orig="' + esc(a) + '">' : '') +
          (b ? '<img alt="" src="' + img(b, 600) + '" data-orig="' + esc(b) + '">' : '') +
        '</div><div class="t2y-rel__txt"><div class="t2y-rel__name">' + esc(p.title) + '</div>' +
        '<div class="t2y-rel__price">' + price(p) + '</div></div></a>';
    });
    var box = document.createElement('div');
    box.className = 't2y-rel';
    box.innerHTML = html + '</div>';
    box.querySelectorAll('img').forEach(function (im) {
      im.onerror = function () { var o = im.getAttribute('data-orig'); if (o && im.src !== o) im.src = o; };
    });
    var head = rec.querySelector('.js-block-header');
    if (head && head.parentNode) head.parentNode.insertBefore(box, head.nextSibling);
    else rec.appendChild(box);
    rec.classList.add('t2y-rel-ready');
    arrows(box, box.querySelector('.t2y-rel__row'));
  }

  function run() {
    var rec = null;
    document.querySelectorAll('.t-rec[data-record-type="786"]').forEach(function (r) {
      var t = (r.querySelector('.js-block-header-title') || {}).textContent || '';
      if (/понрав/i.test(t)) rec = r;
    });
    if (!rec || rec.querySelector('.t2y-rel')) return;
    load().then(function (all) {
      var here = path(location.pathname);
      var cur = all.filter(function (p) { return p.url && path(p.url) === here; })[0];
      if (!cur || rec.querySelector('.t2y-rel')) return;
      var items = pick(all, cur);
      if (items.length) render(rec, items);
    }).catch(function () {});
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run);
  else run();
})();
</script>
