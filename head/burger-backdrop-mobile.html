<!-- БУРГЕР НА МОБИЛЬНОЙ — ПОДЛОЖКА ТОЛЬКО НА СТРАНИЦАХ КАРТОЧЕК.
     Добавлено 13.10.2026, переделано в тот же день.

     ПРОБЛЕМА: на страницах карточек мы открепили шапку (чтобы она не
     закрывала хлебные крошки), но бургер остался position: fixed. Три
     полоски повисли поверх содержимого без фона — на карточке товара
     легли прямо на строку «Параметры модели на фото».

     ЛЕЧЕНИЕ: не откреплять (меню под рукой — это правильно), а подложить
     под бургер белый кружок с мягкой тенью.

     ЧТО ИСПРАВЛЕНО В ЭТОЙ ВЕРСИИ (две ошибки первой):

     1. КРУЖОК ПРОМАХИВАЛСЯ. Первый вариант задавал бургеру свои
        width/height — но полоски внутри позиционированы от его
        собственной коробки, и смена размера их сдвигала. Теперь круг
        рисуется отдельным слоем (::before) позади полосок и центрируется
        по бургеру сам. Размеры бургера не трогаются вообще.

     2. КРУЖОК ВЫЛЕЗАЛ ВЕЗДЕ. На остальных страницах шапка прикреплена
        и подложка там не нужна — она лезла на логотип. Теперь скрипт
        вешает на <html> класс t2y-card-page, и стили действуют только
        при нём.

     КУДА: Настройки сайта → HTML-код внутрь HEAD, в самый конец.
     Старую версию этого блока, если уже вставлена, — удалить целиком. -->

<script>
/* Помечаем страницы карточек товара. Скрипт лежит в HEAD и отрабатывает
   до отрисовки, так что подложка не успевает мигнуть на чужих страницах.

   Два шаблона адреса:
     /p/…        — наши собственные страницы карточек
     /tproduct/… — стандартная страница Tilda (если у товара не прописан
                   URL, витрина ведёт туда; на всякий случай ловим и её) */
(function () {
  var p = location.pathname;
  if (p.indexOf('/p/') === 0 || p.indexOf('/tproduct/') !== -1) {
    document.documentElement.className += ' t2y-card-page';
  }
})();
</script>

<style>
@media screen and (max-width: 960px) {

  /* Бургер становится точкой отсчёта для подложки.
     overflow: visible — чтобы круг мог выйти за его границы.

     isolation: isolate — ключевая строка. Она создаёт у бургера
     собственный слой, и тогда z-index: -1 у подложки уводит её назад,
     но не дальше самого бургера. Благодаря этому полоски остаются
     сверху БЕЗ вмешательства в их стили — а это важно: у Tilda они
     позиционированы абсолютно, и любая правка их позиционирования
     ломает расстояния между ними. */
  html.t2y-card-page .t-menuburger,
  html.t2y-card-page .t450__burger_container,
  html.t2y-card-page .t450__burger_wrapper,
  html.t2y-card-page .tmenu-mobile__burger,
  html.t2y-card-page .t-menuburger__wrapper {
    position: relative !important;
    overflow: visible !important;
    isolation: isolate !important;
    z-index: 900 !important;
  }

  /* САМА ПОДЛОЖКА. Отдельный слой, центрируется по бургеру через
     left/top 50% + transform — поэтому промахнуться не может,
     каким бы ни был размер самого бургера. */
  html.t2y-card-page .t-menuburger::before,
  html.t2y-card-page .t450__burger_container::before,
  html.t2y-card-page .tmenu-mobile__burger::before {
    content: "" !important;
    position: absolute !important;
    left: 50% !important;
    top: 50% !important;
    transform: translate(-50%, -50%) !important;
    width: 46px !important;
    height: 46px !important;
    border-radius: 50% !important;
    background: #ffffff !important;
    box-shadow: 0 2px 10px rgba(0, 0, 0, .14) !important;
    z-index: -1 !important;            /* позади полосок, см. isolation выше */
    pointer-events: none !important;   /* клик проходит на бургер */
  }

  /* ⚠️ ПОЛОСКИ НЕ ТРОГАЕМ. Первая версия ставила им position: relative,
     чтобы поднять над подложкой, — и расстояния между ними разъехались:
     у Tilda они position: absolute с заданными отступами сверху.
     Теперь они лежат выше подложки сами, благодаря isolation: isolate. */

  /* Когда меню открыто, подложка не нужна: бургер превращается в крестик
     поверх тёмной шторки, и белый кружок там выглядит заплаткой. */
  html.t2y-card-page .t-menuburger_opened::before,
  html.t2y-card-page .t450__burger_container_opened::before {
    opacity: 0 !important;
  }
}
</style>
