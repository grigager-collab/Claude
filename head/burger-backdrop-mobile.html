<!-- БУРГЕР НА МОБИЛЬНОЙ — ПОДЛОЖКА, ЧТОБЫ НЕ НАЕЗЖАЛ НА ТЕКСТ.
     Добавлено 13.10.2026.

     ПРОБЛЕМА: на мобильной мы открепили шапку (чтобы не закрывала хлебные
     крошки), но бургер остался position: fixed. В итоге три полоски висят
     поверх содержимого без фона — на карточке товара они легли прямо
     на строку «Параметры модели на фото».

     ЛЕЧЕНИЕ: не откреплять (меню под рукой — это правильно), а дать бургеру
     собственную подложку: белый кружок с мягкой тенью. Тогда он читается
     на любом фоне и выглядит как задуманная плавающая кнопка.

     КУДА: Настройки сайта → HTML-код внутрь HEAD, в самый конец.

     ⚠️ СЕЛЕКТОРЫ. У Tilda бургер живёт в разных блоках под разными классами,
     поэтому ниже перечислены все ходовые. Если не подхватится — открой на
     телефоне инспектор (или пришли мне HTML элемента), добавим нужный класс.
     Лишние селекторы в списке безвредны: они просто ни во что не попадут. -->

<style>
@media screen and (max-width: 960px) {

  /* Сама кнопка-бургер, какой бы блок её ни рисовал */
  .t-menuburger.t-menuburger,
  .t450__burger_container.t450__burger_container,
  .t450__burger_wrapper.t450__burger_wrapper,
  .tmenu-mobile__burger.tmenu-mobile__burger,
  .t-menuburger__wrapper.t-menuburger__wrapper {

    /* подложка */
    background: #ffffff !important;
    border-radius: 50% !important;
    box-shadow: 0 2px 10px rgba(0, 0, 0, .14) !important;

    /* размер кружка: полоски внутри остаются прежними,
       место под них добавляем паддингом */
    width: 44px !important;
    height: 44px !important;
    padding: 0 !important;
    box-sizing: border-box !important;

    /* полоски по центру кружка */
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;

    /* гарантированно выше содержимого страницы, но ниже попапов Tilda
       (у них z-index от 10000) */
    z-index: 900 !important;
  }

  /* Полоски внутри — чуть короче, чтобы дышали в кружке */
  .t-menuburger span,
  .t450__burger_container span,
  .tmenu-mobile__burger span {
    width: 20px !important;
  }

  /* Когда меню открыто, кружок не нужен: бургер превращается в крестик
     поверх тёмной шторки, и белая плашка там смотрится заплаткой. */
  .t-menuburger_opened.t-menuburger_opened,
  .t450__burger_container_opened.t450__burger_container_opened {
    background: transparent !important;
    box-shadow: none !important;
  }
}
</style>
