<!-- ════════════════════════════════════════════════════════════════
     ГЛАВНАЯ, ПК (от 480 px): КРУПНЫЕ ФОТО ВО ВСЮ ШИРИНУ.  27.10.2026
     Заменяет прежний код этого блока (верхний блок, 26.10) — вставить ВСЁ
     вместо старого.

     Заказчица 27.10: верхний блок — «сплошное полотно» крупных квадратных
     фото без полей, без «Больше», вся область фото кликабельна, вместо
     круглых стрелок — другое управление, «как у 12 Storeez». Блоки ниже —
     тоже крупные фото, но вертикальные и со «Больше»; «Выберите у нас» и
     женский блок есть только на телефоне — нужны и на ПК.

     Как устроено: блоки Tilda остаются на странице и правятся как раньше
     (фото, подписи, ссылки). Код берёт из них слайды и на ПК показывает
     по-новому, сами блоки на ПК прячет. Телефон (до 480 px) — блоки Tilda
     как есть; у женского блока только точки внизу заменены палочками
     наверху, как в остальных слайдерах.

     Листать: тонкие стрелки по краям (видны при наведении), колесо/тачпад,
     перетаскивание мышью. На верхнем блоке у курсора — «Смотреть».

     КУДА: Главная → тот же блок «HTML-код» (T123), где стоял прежний код
     верхнего блока, → выделить всё → вставить ВЕСЬ этот файл → Опубликовать.
     Квадратные фото для ПК — в блок-слайдер для ПК (верхний, «Костюмы для
     города»), вытянутые — в такой же блок для телефона.
     ════════════════════════════════════════════════════════════════ -->
<style>
/* полосы — только от 480 px; блоки Tilda, из которых они собраны, на ПК прячем */
@media screen and (max-width: 479px) { .t2y-strip { display: none !important; } }
@media screen and (min-width: 480px) { .t2y-strip-src { display: none !important; } }

.t2y-strip { position: relative; overflow: hidden; background: #ffffff; }
.t2y-strip__head {
  max-width: 1160px; margin: 0 auto; padding: 60px 20px 30px;
  font-family: 'Tenor', 'Tenor Sans', Arial, sans-serif; font-weight: 600;
  font-size: 42px; line-height: 1.23; color: #000000;
}
.t2y-strip__wrap { position: relative; }
.t2y-strip__row {
  display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
  scrollbar-width: none; overscroll-behavior-x: contain;
}
.t2y-strip__row::-webkit-scrollbar { display: none; }
.t2y-strip_drag .t2y-strip__row { scroll-snap-type: none; cursor: grabbing; }
.t2y-strip__item {
  position: relative; flex: 0 0 auto; display: block; overflow: hidden;
  background: #f2f2f2; scroll-snap-align: start; text-decoration: none !important;
}
.t2y-strip__item img {
  position: absolute; left: 0; top: 0; width: 100%; height: 100%;
  object-fit: cover; object-position: 50% 30%;   /* при обрезке сохраняем голову */
  -webkit-user-drag: none; user-select: none;
  transition: transform .8s ease;
}
@media (hover: hover) { a.t2y-strip__item:hover img { transform: scale(1.03); } }
.t2y-strip__cap { position: absolute; left: 32px; right: 32px; z-index: 2; pointer-events: none; }
.t2y-strip__title {
  display: block; font-family: 'Tenor Sans', 'Tenor', Arial, sans-serif; font-weight: 400;
  font-size: 30px; line-height: 1.2; color: #ffffff;
}
.t2y-strip__more {
  display: inline-block; margin-top: 12px; padding-bottom: 1px;
  font-family: 'Raleway', Arial, sans-serif; font-size: 15px; color: #ffffff;
  border-bottom: 1px solid #ffffff;
}

/* верхний блок: квадраты сплошным полотном (как у 12 Storeez), подпись внизу —
   сверху она наезжала бы на головы. Сторона квадрата — половина экрана, но не
   выше экрана под шапкой; на широком мониторе справа выглядывает следующее фото */
.t2y-strip_hero { padding-top: var(--t2y-hh, 72px); --t2y-sq: min(50vw, calc(100vh - var(--t2y-hh, 72px))); }
.t2y-strip_hero .t2y-strip__item { width: var(--t2y-sq); height: var(--t2y-sq); }
/* блоки ниже: крупные вертикальные 3:4, подпись и «Больше» внизу */
.t2y-strip_tall .t2y-strip__item { width: 33.3333vw; height: 44.4444vw; }
/* затемнение снизу — белая подпись читается и на светлом фото */
.t2y-strip__item::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 40%; z-index: 1;
  background: linear-gradient(to bottom, rgba(0, 0, 0, 0), rgba(0, 0, 0, .36)); pointer-events: none;
}
.t2y-strip__cap { bottom: 30px; }

/* стрелки — тонкие, без кружков; видны при наведении на блок */
.t2y-strip__nav {
  position: absolute; top: 50%; z-index: 3; width: 64px; height: 112px; margin-top: -56px;
  display: flex; align-items: center; justify-content: center; padding: 0;
  border: none; background: none; cursor: pointer; opacity: 0; transition: opacity .25s;
}
.t2y-strip__nav svg { width: 20px; height: 40px; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .45)); }
.t2y-strip__nav_prev { left: 6px; }
.t2y-strip__nav_next { right: 6px; }
.t2y-strip__wrap:hover .t2y-strip__nav { opacity: .9; }
.t2y-strip__wrap .t2y-strip__nav:hover { opacity: 1; }
@media (hover: none) { .t2y-strip__nav { opacity: .9; } }   /* планшет без мыши — видны всегда */
.t2y-strip_start .t2y-strip__nav_prev,
.t2y-strip_end .t2y-strip__nav_next,
.t2y-strip_still .t2y-strip__nav { opacity: 0 !important; pointer-events: none; }

/* «Смотреть» рядом с курсором (верхний блок, мышь) */
.t2y-strip__cursor {
  position: absolute; left: 0; top: 0; z-index: 4; pointer-events: none; opacity: 0;
  transition: opacity .2s; white-space: nowrap;
  font-family: 'Raleway', Arial, sans-serif; font-size: 15px; color: #ffffff;
  text-shadow: 0 1px 3px rgba(0, 0, 0, .45);
}
.t2y-strip__cursor_on { opacity: 1; }

@media screen and (max-width: 1199px) {
  .t2y-strip__head { font-size: 36px; padding-top: 50px; }
  .t2y-strip__cap { left: 22px; right: 22px; }
  .t2y-strip__title { font-size: 24px; }
  .t2y-strip__cap { bottom: 22px; }
  .t2y-strip_tall .t2y-strip__item { width: 50vw; height: 66.6667vw; }
}
@media screen and (max-width: 767px) {
  .t2y-strip__head { font-size: 30px; padding-top: 40px; }
  .t2y-strip_hero { --t2y-sq: min(80vw, calc(100vh - var(--t2y-hh, 72px))); }
  .t2y-strip_tall .t2y-strip__item { width: 70vw; height: 93.3333vw; }
}

/* Телефон, женский блок (слайдер T675): точки внизу → палочки наверху,
   как в остальных слайдерах главной */
@media screen and (max-width: 479px) {
  #rec1641003561 .t-slds__container { position: relative; }
  #rec1641003561 .t-slds__bullet_wrapper {
    position: absolute; top: 24px; left: 22px; right: 22px; z-index: 5;
    width: auto !important; display: flex; gap: 4px; margin: 0; padding: 0;
  }
  #rec1641003561 .t-slds__bullet { flex: 1 1 0; margin: 0 !important; padding: 8px 0 !important; }
  #rec1641003561 .t-slds__bullet_body {
    display: block; width: 100% !important; height: 2px !important; padding: 0;
    border: none !important; border-radius: 0 !important;
    background: rgba(255, 255, 255, .45) !important;
  }
  #rec1641003561 .t-slds__bullet_active .t-slds__bullet_body { background: #ffffff !important; }
}
</style>
<script>
(function () {
  // Какие блоки Tilda показываем по-новому (номер — «Block id» в настройках блока)
  var BLOCKS = [
    { src: 'rec2271738031', kind: 'hero' },                         // верхний, версия для ПК
    { src: 'rec5138965001', kind: 'tall' },                         // «Выберите у нас» (у Tilda — только телефон)
    { src: 'rec2075776071', kind: 'tall' },                         // «Конструктор образа»
    { src: 'rec1641003561', kind: 'tall', head: 'rec5141598601' }   // женский; заголовок — в блоке над ним
  ];

  function esc(s) {
    return String(s || '').replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function txt(el) { return el ? (el.textContent || '').replace(/\s+/g, ' ').trim() : ''; }
  // webp-копия с CDN Tilda (меньше весит); не загрузится — оригинал
  function webp(u) {
    var m = /^https:\/\/static\.tildacdn\.com\/(til[ad][^/]+)\/([^/?#]+)$/.exec(u);
    return m ? 'https://optim.tildacdn.com/' + m[1] + '/-/format/webp/' + m[2] : u;
  }

  // слайды блока; у слайдеров с копиями (0 и последний — копии) копии пропускаем
  function slides(rec) {
    var items = [].slice.call(rec.querySelectorAll('.t994__item, .t-slds__item'));
    var idx = items.map(function (it) { return parseInt(it.getAttribute('data-slide-index'), 10); });
    var clones = idx.indexOf(0) >= 0;
    var max = Math.max.apply(null, idx.filter(function (n) { return !isNaN(n); }));
    var out = [];
    items.forEach(function (it, k) {
      if (clones && (idx[k] === 0 || idx[k] === max)) return;
      var im = it.querySelector('[data-original]');
      var src = im && im.getAttribute('data-original');
      if (!src) return;
      var a = it.querySelector('a[href]');
      var href = a ? a.getAttribute('href') : '';
      if (href && /^(#|javascript:)/i.test(href)) href = '';
      // «в новом окне» — только для чужих сайтов (VipAvenue); свои страницы — в той же вкладке
      var external = href && /^https?:\/\//i.test(href) && a.hostname !== location.hostname;
      out.push({
        src: src,
        title: txt(it.querySelector('.t994__title, [class*="__title"]')),
        href: href,
        blank: !!external && a.getAttribute('target') === '_blank',
        more: txt(it.querySelector('.t-btntext__text')).replace(/[→\s]+$/, '') || 'Больше'
      });
    });
    return out;
  }

  function item(s, kind, n) {
    var tag = s.href ? 'a' : 'div';
    var attrs = s.href ? ' href="' + esc(s.href) + '" draggable="false"' + (s.blank ? ' target="_blank" rel="noopener"' : '') : '';
    var cap = '';
    if (s.title) cap += '<span class="t2y-strip__title">' + esc(s.title) + '</span>';
    if (s.href && kind === 'tall') cap += '<span class="t2y-strip__more">' + esc(s.more) + ' →</span>';
    return '<' + tag + ' class="t2y-strip__item"' + attrs + '>' +
      '<img alt="' + esc(s.title) + '" src="' + esc(webp(s.src)) + '" data-orig="' + esc(s.src) + '" draggable="false"' +
        (kind === 'hero' && n < 3 ? '' : ' loading="lazy"') + '>' +
      (cap ? '<span class="t2y-strip__cap">' + cap + '</span>' : '') +
      '</' + tag + '>';
  }

  function arrows(box, row) {
    var svg = function (d) {
      return '<svg viewBox="0 0 20 40" fill="none"><path d="' + d + '" stroke="#ffffff" stroke-width="1.5"/></svg>';
    };
    var wrap = row.parentNode;
    var prev = document.createElement('button'), next = document.createElement('button');
    prev.type = next.type = 'button';
    prev.className = 't2y-strip__nav t2y-strip__nav_prev'; prev.setAttribute('aria-label', 'Назад');
    next.className = 't2y-strip__nav t2y-strip__nav_next'; next.setAttribute('aria-label', 'Вперёд');
    prev.innerHTML = svg('M18 2L2 20l16 18'); next.innerHTML = svg('M2 2l16 18L2 38');
    wrap.appendChild(prev); wrap.appendChild(next);
    var stepW = function () { var it = row.firstElementChild; return it ? it.offsetWidth : row.clientWidth; };
    prev.onclick = function () { row.scrollBy({ left: -stepW(), behavior: 'smooth' }); };
    next.onclick = function () { row.scrollBy({ left: stepW(), behavior: 'smooth' }); };
    function state() {
      box.classList.toggle('t2y-strip_still', row.scrollWidth <= row.clientWidth + 2);
      box.classList.toggle('t2y-strip_start', row.scrollLeft < 4);
      box.classList.toggle('t2y-strip_end', row.scrollLeft + row.clientWidth > row.scrollWidth - 4);
    }
    row.addEventListener('scroll', state, { passive: true });
    window.addEventListener('resize', state);
    state(); setTimeout(state, 800);
  }

  // перетаскивание мышью; протащили — это не клик по фото
  function drag(box, row) {
    var x0 = 0, s0 = 0, down = false, moved = false;
    row.addEventListener('pointerdown', function (e) {
      if (e.pointerType !== 'mouse' || e.button !== 0) return;
      down = true; moved = false; x0 = e.clientX; s0 = row.scrollLeft;
    });
    window.addEventListener('pointermove', function (e) {
      if (!down) return;
      var dx = e.clientX - x0;
      if (!moved && Math.abs(dx) > 6) { moved = true; box.classList.add('t2y-strip_drag'); }
      if (moved) row.scrollLeft = s0 - dx;
    });
    window.addEventListener('pointerup', function () {
      if (!down) return;
      down = false;
      if (moved) box.classList.remove('t2y-strip_drag');   // дальше браузер сам доводит до ближайшего фото
    });
    row.addEventListener('click', function (e) {
      if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; }
    }, true);
  }

  // «Смотреть» у курсора — только для мыши и только над фото со ссылкой
  function cursor(wrap) {
    if (!window.matchMedia || !matchMedia('(hover: hover) and (pointer: fine)').matches) return;
    var c = document.createElement('div');
    c.className = 't2y-strip__cursor';
    c.textContent = 'Смотреть →';
    wrap.appendChild(c);
    wrap.addEventListener('pointermove', function (e) {
      var on = e.pointerType === 'mouse' && e.target.closest && e.target.closest('a.t2y-strip__item') && !e.target.closest('.t2y-strip__nav');
      c.classList.toggle('t2y-strip__cursor_on', !!on);
      if (!on) return;
      var r = wrap.getBoundingClientRect();
      c.style.transform = 'translate(' + (e.clientX - r.left + 18) + 'px,' + (e.clientY - r.top + 14) + 'px)';
    });
    wrap.addEventListener('pointerleave', function () { c.classList.remove('t2y-strip__cursor_on'); });
  }

  // отступ сверху = высота шапки (меняется с шириной экрана); сторона квадрата —
  // половина экрана, но не выше экрана под шапкой. Если справа выглянула бы
  // только узкая полоска следующего фото — квадраты ровно по половине экрана
  function headerHeight(box) {
    var art = document.querySelector('#rec2498768581 .t396__artboard');
    var set = function () {
      var hh = art && art.offsetHeight ? art.offsetHeight : 72;
      box.style.setProperty('--t2y-hh', hh + 'px');
      var w = document.documentElement.clientWidth, half = w >= 768 ? w / 2 : w * 0.8;
      var sq = Math.min(half, window.innerHeight - hh);
      var rest = w - sq * Math.floor(w / sq);
      if (rest > 0 && rest < 120) sq = w / Math.floor(w / sq);
      box.style.setProperty('--t2y-sq', Math.floor(sq) + 'px');
    };
    set();
    window.addEventListener('resize', set);
    if (art && window.ResizeObserver) new ResizeObserver(set).observe(art);
  }

  function build(cfg) {
    var rec = document.getElementById(cfg.src);
    if (!rec || rec.t2yStrip) return;
    var list = slides(rec);
    if (!list.length) return;   // слайдов нет — остаётся блок Tilda
    rec.t2yStrip = true;

    var headRec = cfg.head ? document.getElementById(cfg.head) : null;
    var headEl = headRec ? headRec.querySelector('.t795__title, .t-title, .t-name') : rec.querySelector('.js-block-header-title');
    var box = document.createElement('div');
    box.className = 't2y-strip t2y-strip_' + cfg.kind;
    // фон — как у блока Tilda (у «Конструктора образа» тёмный); заголовок отдельным
    // блоком — его фон. Цвет заголовка — по фону: на тёмном белый, на светлом чёрный
    var bg = getComputedStyle(headRec || rec).backgroundColor;
    var rgb = (bg.match(/[\d.]+/g) || []).map(Number);
    var solid = rgb.length >= 3 && (rgb.length < 4 || rgb[3] > 0.5);
    if (solid) box.style.background = bg;
    var dark = solid && (0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2]) < 128;
    var head = cfg.kind === 'hero' ? '' : txt(headEl);
    var html = '';
    list.forEach(function (s, n) { html += item(s, cfg.kind, n); });
    box.innerHTML = (head ? '<div class="t2y-strip__head">' + esc(head) + '</div>' : '') +
      '<div class="t2y-strip__wrap"><div class="t2y-strip__row">' + html + '</div></div>';
    if (head && dark) box.firstChild.style.color = '#ffffff';
    box.querySelectorAll('img').forEach(function (im) {
      im.onerror = function () { var o = im.getAttribute('data-orig'); if (o && im.src !== o) im.src = o; };
    });
    var before = headRec || rec;
    before.parentNode.insertBefore(box, before);
    rec.classList.add('t2y-strip-src');
    if (headRec) headRec.classList.add('t2y-strip-src');

    var row = box.querySelector('.t2y-strip__row');
    arrows(box, row);
    drag(box, row);
    if (cfg.kind === 'hero') { headerHeight(box); cursor(box.querySelector('.t2y-strip__wrap')); }
  }

  function run() { BLOCKS.forEach(build); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run);
  else run();
})();
</script>
<!-- ════ конец: главная, ПК — крупные фото ════ -->
